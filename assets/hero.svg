<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-label="Vaani: Your business, always answered. AI front office for WhatsApp and voice.">
  <style>
    text { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .m { opacity: 0; animation-duration: 14s; animation-iteration-count: infinite; animation-timing-function: ease-out; }
    #m1 { animation-name: k1; }
    #m2 { animation-name: k2; }
    #m3 { animation-name: k3; }
    #m4 { animation-name: k4; }
    #t1 { animation-name: kt1; }
    #t2 { animation-name: kt2; }
    @keyframes k1 { 0%, 3% { opacity: 0; transform: translateY(8px); } 6%, 92% { opacity: 1; transform: none; } 97%, 100% { opacity: 0; } }
    @keyframes kt1 { 0%, 10% { opacity: 0; } 12%, 17% { opacity: 1; } 19%, 100% { opacity: 0; } }
    @keyframes k2 { 0%, 18% { opacity: 0; transform: translateY(8px); } 21%, 92% { opacity: 1; transform: none; } 97%, 100% { opacity: 0; } }
    @keyframes k3 { 0%, 35% { opacity: 0; transform: translateY(8px); } 38%, 92% { opacity: 1; transform: none; } 97%, 100% { opacity: 0; } }
    @keyframes kt2 { 0%, 42% { opacity: 0; } 44%, 49% { opacity: 1; } 51%, 100% { opacity: 0; } }
    @keyframes k4 { 0%, 50% { opacity: 0; transform: translateY(8px); } 53%, 92% { opacity: 1; transform: none; } 97%, 100% { opacity: 0; } }
    .d { animation: b 1s infinite; }
    .d2 { animation-delay: .15s; }
    .d3 { animation-delay: .3s; }
    @keyframes b { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .m { animation: none; opacity: 1; }
      #t1, #t2 { display: none; }
      .d { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#183F35"/>
      <stop offset="100%" stop-color="#0E2822"/>
    </linearGradient>
  </defs>
  <rect width="800" height="440" rx="20" fill="url(#bg)"/>

  <!-- Left: Brand Story -->
  <g transform="translate(44, 0)">
    <rect x="0" y="55" width="40" height="40" rx="12" fill="#1D6D56"/>
    <text x="20" y="82" font-size="20" font-weight="800" fill="#FFF" text-anchor="middle">वा</text>

    <text x="52" y="82" font-size="28" font-weight="800" fill="#FFF" letter-spacing="-0.5">Vaani</text>
    
    <text x="0" y="145" font-size="34" font-weight="800" fill="#FFF" letter-spacing="-0.5">Your business,</text>
    <text x="0" y="185" font-size="34" font-weight="800" fill="#D97736" letter-spacing="-0.5">always answered.</text>

    <text x="0" y="235" font-size="15" fill="#CBD5E1" line-height="1.5">Every call answered. Every booking secured.</text>
    <text x="0" y="258" font-size="15" fill="#CBD5E1">In Hindi, Odia, Hinglish and English.</text>

    <rect x="0" y="295" width="220" height="36" rx="18" fill="#1D6D56"/>
    <text x="110" y="318" font-size="13" font-weight="700" fill="#FFF" text-anchor="middle">Clinics · Salons · Studios · SMBs</text>

    <text x="0" y="375" font-size="12" fill="#788A82">DPDP Compliant · Zero Hallucinations · Real-Time Control</text>
  </g>

  <!-- Right: WhatsApp Phone Frame -->
  <g transform="translate(430, 25)">
    <rect width="330" height="390" rx="24" fill="#EFECE6" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    
    <!-- Phone Header -->
    <path d="M0 24A24 24 0 0 1 24 0h282a24 24 0 0 1 24 24v38H0z" fill="#183F35"/>
    <circle cx="34" cy="31" r="15" fill="#1D6D56"/>
    <text x="34" y="37" font-size="14" font-weight="800" fill="#FFF" text-anchor="middle">वा</text>
    <text x="58" y="26" font-size="14" font-weight="700" fill="#FFF">Dr. Sharma Clinic</text>
    <text x="58" y="42" font-size="11" fill="#A0C9B9">Vaani AI Assistant · online</text>

    <!-- Message 1 (Customer) -->
    <g id="m1" class="m">
      <rect x="40" y="78" width="270" height="42" rx="12" fill="#DCF8C6"/>
      <text x="54" y="104" font-size="13" fill="#111">Kal shaam ko appointment chahiye</text>
    </g>

    <!-- Typing Indicator 1 -->
    <g id="t1" class="m">
      <rect x="20" y="132" width="60" height="28" rx="14" fill="#FFF"/>
      <circle class="d" cx="36" cy="146" r="3" fill="#667781"/>
      <circle class="d d2" cx="46" cy="146" r="3" fill="#667781"/>
      <circle class="d d3" cx="56" cy="146" r="3" fill="#667781"/>
    </g>

    <!-- Message 2 (Vaani Offer with Tap Slots) -->
    <g id="m2" class="m">
      <rect x="20" y="132" width="280" height="106" rx="12" fill="#FFF"/>
      <text x="32" y="154" font-size="12" fill="#111">Namaste! Kal यानी शनिवार ke ye slots khali hain:</text>
      
      <!-- Tap Buttons -->
      <rect x="32" y="168" width="76" height="30" rx="15" fill="#EAF3EF" stroke="#1D6D56"/>
      <text x="70" y="188" font-size="11" font-weight="650" fill="#1D6D56" text-anchor="middle">5:00 PM</text>

      <rect x="114" y="168" width="76" height="30" rx="15" fill="#1D6D56"/>
      <text x="152" y="188" font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">5:30 PM</text>

      <rect x="196" y="168" width="76" height="30" rx="15" fill="#EAF3EF" stroke="#1D6D56"/>
      <text x="234" y="188" font-size="11" font-weight="650" fill="#1D6D56" text-anchor="middle">6:15 PM</text>
      
      <text x="32" y="224" font-size="10" fill="#788A82">Taps over typing · 120s hold</text>
    </g>

    <!-- Message 3 (Customer Choice) -->
    <g id="m3" class="m">
      <rect x="190" y="250" width="120" height="34" rx="12" fill="#DCF8C6"/>
      <text x="250" y="272" font-size="13" fill="#111" text-anchor="middle">5:30 PM ✅</text>
    </g>

    <!-- Typing Indicator 2 -->
    <g id="t2" class="m">
      <rect x="20" y="294" width="60" height="28" rx="14" fill="#FFF"/>
      <circle class="d" cx="36" cy="308" r="3" fill="#667781"/>
      <circle class="d d2" cx="46" cy="308" r="3" fill="#667781"/>
      <circle class="d d3" cx="56" cy="308" r="3" fill="#667781"/>
    </g>

    <!-- Message 4 (Confirmation with Landmark Pin) -->
    <g id="m4" class="m">
      <rect x="20" y="294" width="280" height="80" rx="12" fill="#FFF"/>
      <text x="32" y="316" font-size="12" font-weight="700" fill="#1D6D56">✓ Booking Confirmed</text>
      <text x="32" y="334" font-size="12" fill="#111">Dr. Priya Sharma · Kal, 5:30 PM</text>
      <text x="32" y="352" font-size="11" fill="#667781">📍 Bapuji Nagar, SBI ke samne</text>
      <text x="32" y="367" font-size="10" fill="#94A3B8">24h pehle reminder bhej dungi 🙏</text>
    </g>
  </g>
</svg>
