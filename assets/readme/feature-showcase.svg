<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%" role="img" aria-label="Vaani Standout Capabilities: 4-Card Architecture Showcase">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="grid-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#183F35" />
      <stop offset="60%" stop-color="#11332A" />
      <stop offset="100%" stop-color="#0E2822" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#163C31" />
      <stop offset="100%" stop-color="#0E2721" />
    </linearGradient>

    <linearGradient id="amber-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97736" />
    </linearGradient>

    <linearGradient id="pill-badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D6D56" />
      <stop offset="100%" stop-color="#14493A" />
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="card-drop" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    <![CDATA[
    text {
      font-family: "Plus Jakarta Sans", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* CARD 1: Phone Vibrate & Webhook Packet Flow */
    .phone-ring {
      animation: phoneVibe 2s ease-in-out infinite;
      transform-origin: 52px 148px;
    }
    @keyframes phoneVibe {
      0%, 100% { transform: rotate(0deg); }
      10%, 30% { transform: rotate(-8deg); }
      20%, 40% { transform: rotate(8deg); }
      50% { transform: rotate(0deg); }
    }

    .webhook-packet {
      animation: packetFly 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes packetFly {
      0% { cx: 88; opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { cx: 168; opacity: 0; }
    }

    .wa-bubble-pop {
      animation: waBubble 2.2s ease-out infinite;
    }
    @keyframes waBubble {
      0%, 45% { opacity: 0.3; transform: scale(0.96); }
      55%, 90% { opacity: 1; transform: scale(1); }
      100% { opacity: 0.3; transform: scale(0.96); }
    }

    /* CARD 2: Clock Hand Rotation & Revenue Ticker */
    .clock-hand-hour {
      transform-origin: 64px 148px;
      animation: rotateHour 6s linear infinite;
    }
    .clock-hand-min {
      transform-origin: 64px 148px;
      animation: rotateMin 2s linear infinite;
    }
    @keyframes rotateHour {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes rotateMin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .revenue-ticker {
      animation: revenuePulse 3s ease-in-out infinite alternate;
    }
    @keyframes revenuePulse {
      0% { fill: #22C55E; transform: scale(1); }
      100% { fill: #F59E0B; transform: scale(1.05); }
    }

    /* CARD 3: Scope Gate Scanner Beam & Shield Glow */
    .scan-beam {
      animation: beamSweep 3s ease-in-out infinite alternate;
    }
    @keyframes beamSweep {
      0% { y: 118; opacity: 0.3; }
      50% { y: 154; opacity: 1; }
      100% { y: 182; opacity: 0.3; }
    }

    .shield-pulse {
      animation: shieldGlowAnim 2.5s ease-in-out infinite alternate;
    }
    @keyframes shieldGlowAnim {
      0% { stroke: #22C55E; stroke-width: 1.5; }
      100% { stroke: #A0C9B9; stroke-width: 2.8; }
    }

    /* CARD 4: Staff Handoff Toggle Switch Slide */
    .toggle-knob {
      animation: toggleSlide 4s ease-in-out infinite alternate;
    }
    @keyframes toggleSlide {
      0%, 30% { transform: translateX(0px); fill: #A0C9B9; }
      70%, 100% { transform: translateX(24px); fill: #F59E0B; }
    }

    .toggle-state-ai {
      animation: stateAi 4s ease-in-out infinite alternate;
    }
    @keyframes stateAi {
      0%, 30% { opacity: 1; }
      70%, 100% { opacity: 0.3; }
    }

    .toggle-state-human {
      animation: stateHuman 4s ease-in-out infinite alternate;
    }
    @keyframes stateHuman {
      0%, 30% { opacity: 0.3; }
      70%, 100% { opacity: 1; }
    }

    /* Reduced Motion Preference */
    @media (prefers-reduced-motion: reduce) {
      .phone-ring, .webhook-packet, .wa-bubble-pop,
      .clock-hand-hour, .clock-hand-min, .revenue-ticker,
      .scan-beam, .shield-pulse, .toggle-knob, .toggle-state-ai, .toggle-state-human {
        animation: none !important;
      }
      .toggle-knob { transform: translateX(24px) !important; fill: #F59E0B !important; }
      .toggle-state-human { opacity: 1 !important; }
      .toggle-state-ai { opacity: 0.6 !important; }
    }
    ]]>
  </style>

  <!-- Canvas Frame -->
  <rect width="900" height="420" rx="20" fill="url(#grid-bg)" />

  <!-- Background Decorative Grid -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="450" y1="0" x2="450" y2="420" stroke-dasharray="4 6" />
    <line x1="0" y1="230" x2="900" y2="230" stroke-dasharray="4 6" />
  </g>

  <!-- ==================================================== -->
  <!-- TOP HEADER / SECTION BANNER                          -->
  <!-- ==================================================== -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="230" height="20" rx="10" fill="rgba(217,119,54,0.18)" stroke="#D97736" stroke-width="1" />
    <text x="115" y="14" font-size="10" font-weight="700" fill="#F59E0B" text-anchor="middle">
      PRODUCTION ARCHITECTURE MATRIX
    </text>

    <text x="248" y="15" font-size="15" font-weight="800" fill="#FFFFFF" letter-spacing="-0.3">
      Four Standout Capabilities That Put Indian SMBs in Full Control
    </text>
  </g>

  <!-- ==================================================== -->
  <!-- ROW 1, CARD 1: Missed-Call-to-WhatsApp Bridge        -->
  <!-- ==================================================== -->
  <g transform="translate(30, 56)" filter="url(#card-drop)">
    <rect width="410" height="165" rx="16" fill="url(#card-surface)" stroke="rgba(160,201,185,0.25)" stroke-width="1.2" />

    <!-- Card Header -->
    <g transform="translate(18, 16)">
      <circle cx="12" cy="12" r="12" fill="#1D6D56" />
      <!-- Small Phone Icon -->
      <path d="M8 8 C9 8 9.5 9 9.2 9.8 L8.6 10.8 C9.5 12 10.5 13 11.7 13.8 L12.7 13.3 C13.5 13 14.5 13.5 14.5 14.5 C14.5 15.5 13.5 16.5 12 16.5 C8 16.5 4.5 13 4.5 9 C4.5 7.5 5.5 6.5 6.5 6.5 C7 6.5 7.5 7.5 8 8 Z" fill="#22C55E" />
      
      <text x="32" y="11" font-size="13" font-weight="700" fill="#FFFFFF">Missed-Call-to-WhatsApp Bridge</text>
      <text x="32" y="24" font-size="10.5" font-weight="500" fill="#A0C9B9">Webhook latency &lt; 2s · 0 lost leads</text>

      <rect x="290" y="2" width="76" height="20" rx="10" fill="#144C3D" />
      <text x="328" y="16" font-size="9" font-weight="700" fill="#22C55E" text-anchor="middle">&lt; 2s BRIDGE</text>
    </g>

    <!-- Interactive Graphic Area -->
    <g transform="translate(18, 54)">
      <!-- Ringing Phone Node -->
      <g class="phone-ring" transform="translate(10, 10)">
        <rect width="40" height="58" rx="8" fill="#14362E" stroke="#22C55E" stroke-width="1.5" />
        <circle cx="20" cy="50" r="3" fill="#A0C9B9" />
        <!-- Missed Call Alert Badge -->
        <circle cx="36" cy="4" r="7" fill="#EF4444" />
        <text x="36" y="7.5" font-size="8" font-weight="800" fill="#FFFFFF" text-anchor="middle">!</text>
        <path d="M12 24 C14 20 26 20 28 24" stroke="#22C55E" stroke-width="1.5" fill="none" />
      </g>

      <!-- Connecting Webhook Flow Track -->
      <line x1="72" y1="40" x2="182" y2="40" stroke="rgba(160,201,185,0.3)" stroke-width="2" stroke-dasharray="3 4" />
      <circle class="webhook-packet" cx="88" cy="40" r="4.5" fill="#F59E0B" filter="url(#subtle-glow)" />

      <!-- WhatsApp Utility Template Card -->
      <g class="wa-bubble-pop" transform="translate(196, 4)">
        <rect width="170" height="70" rx="8" fill="#FFFFFF" stroke="#22C55E" stroke-width="1.2" />
        <path d="M0 8A8 8 0 0 1 8 0h154a8 8 0 0 1 8 8v16H0z" fill="#183F35" />
        <text x="10" y="16" font-size="9.5" font-weight="700" fill="#FFFFFF">WhatsApp Utility Template</text>
        
        <text x="10" y="36" font-size="8.5" font-weight="600" fill="#1E293B">Namaste! Missed your call.</text>
        <text x="10" y="48" font-size="8" fill="#64748B">Dr. Sharma Clinic assistant here.</text>
        
        <rect x="10" y="54" width="70" height="12" rx="6" fill="#F0FDF4" stroke="#1D6D56" stroke-width="0.8" />
        <text x="45" y="63" font-size="7.5" font-weight="700" fill="#166534" text-anchor="middle">Book Slot Tap</text>
      </g>
    </g>

    <!-- Bottom Stat Pill -->
    <text x="18" y="148" font-size="10" font-weight="600" fill="#A0C9B9">
      ⚡ Converts 35% of busy-hour missed callers into confirmed bookings
    </text>
  </g>

  <!-- ==================================================== -->
  <!-- ROW 1, CARD 2: 08:00 AM Owner Morning Brief          -->
  <!-- ==================================================== -->
  <g transform="translate(460, 56)" filter="url(#card-drop)">
    <rect width="410" height="165" rx="16" fill="url(#card-surface)" stroke="rgba(160,201,185,0.25)" stroke-width="1.2" />

    <!-- Card Header -->
    <g transform="translate(18, 16)">
      <circle cx="12" cy="12" r="12" fill="#D97736" />
      <!-- Sun / Clock Glyph -->
      <circle cx="12" cy="12" r="6" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
      <line x1="12" y1="8" x2="12" y2="12" stroke="#FFFFFF" stroke-width="1.5" />
      <line x1="12" y1="12" x2="15" y2="12" stroke="#FFFFFF" stroke-width="1.5" />

      <text x="32" y="11" font-size="13" font-weight="700" fill="#FFFFFF">08:00 AM Owner Morning Brief</text>
      <text x="32" y="24" font-size="10.5" font-weight="500" fill="#A0C9B9">Daily digest on WhatsApp · 0 app logins needed</text>

      <rect x="290" y="2" width="76" height="20" rx="10" fill="rgba(217,119,54,0.2)" stroke="#D97736" stroke-width="0.8" />
      <text x="328" y="16" font-size="9" font-weight="700" fill="#F59E0B" text-anchor="middle">08:00 AM SHARP</text>
    </g>

    <!-- Interactive Graphic Area -->
    <g transform="translate(18, 54)">
      <!-- Analog Clock Graphic -->
      <g transform="translate(14, 8)">
        <circle cx="28" cy="28" r="28" fill="#14362E" stroke="#D97736" stroke-width="2" />
        <!-- Hour Markers -->
        <circle cx="28" cy="6" r="1.5" fill="#A0C9B9" />
        <circle cx="50" cy="28" r="1.5" fill="#A0C9B9" />
        <circle cx="28" cy="50" r="1.5" fill="#A0C9B9" />
        <circle cx="6" cy="28" r="1.5" fill="#A0C9B9" />
        
        <!-- Center Pivot -->
        <circle cx="28" cy="28" r="2.5" fill="#F59E0B" />
        <!-- Hour Hand pointing to 8 -->
        <line class="clock-hand-hour" x1="28" y1="28" x2="16" y2="35" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
        <!-- Minute Hand pointing to 12 -->
        <line class="clock-hand-min" x1="28" y1="28" x2="28" y2="10" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" />
      </g>

      <!-- Connecting Delivery Beam -->
      <line x1="84" y1="36" x2="174" y2="36" stroke="rgba(245,158,11,0.4)" stroke-width="2" stroke-dasharray="3 4" />
      <path d="M174 36 L168 32 M174 36 L168 40" stroke="#F59E0B" stroke-width="1.8" />

      <!-- Morning Brief WhatsApp Message Card -->
      <g transform="translate(186, 2)">
        <rect width="180" height="74" rx="8" fill="#FFFFFF" stroke="#D97736" stroke-width="1.2" />
        <rect width="180" height="18" rx="8" fill="#183F35" />
        <text x="8" y="13" font-size="9" font-weight="700" fill="#FFFFFF">🌅 Suprabhat Dr. Sharma!</text>
        
        <text x="8" y="32" font-size="8.5" font-weight="600" fill="#1E293B">Today's Schedule: 8 Confirmed</text>
        <text x="8" y="46" font-size="8" fill="#475569">First Patient: 10:30 AM (Sunita R.)</text>
        
        <!-- Recovered Revenue Ticker -->
        <rect x="8" y="52" width="164" height="16" rx="4" fill="#FEF3C7" />
        <text class="revenue-ticker" x="14" y="64" font-size="8.5" font-weight="800" fill="#92400E">
          ✨ Overnight Recovered: ₹2,000
        </text>
      </g>
    </g>

    <!-- Bottom Stat Pill -->
    <text x="18" y="148" font-size="10" font-weight="600" fill="#A0C9B9">
      📊 Delivered daily at 08:00 AM straight to owner WhatsApp
    </text>
  </g>

  <!-- ==================================================== -->
  <!-- ROW 2, CARD 3: 0-Hallucination Scope Gate            -->
  <!-- ==================================================== -->
  <g transform="translate(30, 235)" filter="url(#card-drop)">
    <rect width="410" height="165" rx="16" fill="url(#card-surface)" stroke="rgba(160,201,185,0.25)" stroke-width="1.2" />

    <!-- Card Header -->
    <g transform="translate(18, 16)">
      <circle cx="12" cy="12" r="12" fill="#1D6D56" />
      <!-- Shield Icon -->
      <path d="M8 8 L12 6 L16 8 C16 13 12 16 12 16 C12 16 8 13 8 8 Z" fill="none" stroke="#22C55E" stroke-width="1.5" />

      <text x="32" y="11" font-size="13" font-weight="700" fill="#FFFFFF">0-Hallucination Scope Gate</text>
      <text x="32" y="24" font-size="10.5" font-weight="500" fill="#A0C9B9">Dual token filtering · Answers strictly from clinic truth</text>

      <rect x="290" y="2" width="76" height="20" rx="10" fill="#144C3D" />
      <text x="328" y="16" font-size="9" font-weight="700" fill="#22C55E" text-anchor="middle">FACT SHIELD</text>
    </g>

    <!-- Interactive Graphic Area -->
    <g transform="translate(18, 54)">
      <!-- Inbound Query Box -->
      <g transform="translate(4, 8)">
        <rect width="105" height="58" rx="8" fill="#14362E" stroke="rgba(160,201,185,0.3)" stroke-width="1" />
        <text x="8" y="18" font-size="8" font-weight="700" fill="#A0C9B9">INBOUND QUERY</text>
        <text x="8" y="32" font-size="8.5" fill="#EFECE6">"Can you give me</text>
        <text x="8" y="44" font-size="8.5" fill="#EFECE6">antibiotic prescription?"</text>
      </g>

      <!-- Dual Scope Gate Filter / Scanning Wall -->
      <g transform="translate(120, 4)">
        <rect width="36" height="66" rx="6" fill="#0F2B23" stroke="#22C55E" stroke-width="1.5" />
        <text x="18" y="16" font-size="7" font-weight="800" fill="#22C55E" text-anchor="middle">SCOPE</text>
        <text x="18" y="26" font-size="7" font-weight="800" fill="#22C55E" text-anchor="middle">GATE</text>
        <line class="scan-beam" x1="4" y1="36" x2="32" y2="36" stroke="#F59E0B" stroke-width="2" />
        <text x="18" y="56" font-size="8" font-weight="800" fill="#F59E0B" text-anchor="middle">SAFE</text>
      </g>

      <!-- Verified Action Shield Result -->
      <g transform="translate(170, 8)">
        <rect width="195" height="58" rx="8" fill="#FFFFFF" stroke="#22C55E" stroke-width="1.5" />
        <!-- Shield badge -->
        <g transform="translate(12, 14)">
          <path class="shield-pulse" d="M0 4 L10 0 L20 4 C20 12 10 18 10 18 C10 18 0 12 0 4 Z" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.8" />
          <path d="M6 9 L9 12 L14 6" stroke="#22C55E" stroke-width="1.5" fill="none" stroke-linecap="round" />
        </g>
        <text x="40" y="22" font-size="9" font-weight="800" fill="#183F35">Medical Advice Blocked</text>
        <text x="40" y="36" font-size="8" fill="#475569">"Only Dr. Sharma can prescribe."</text>
        <text x="40" y="48" font-size="8" font-weight="700" fill="#22C55E">Auto-routed to Doctor Consultation</text>
      </g>
    </g>

    <!-- Bottom Stat Pill -->
    <text x="18" y="148" font-size="10" font-weight="600" fill="#A0C9B9">
      🛡️ Zero hallucinated fees, treatments or legal advice. Verified facts only.
    </text>
  </g>

  <!-- ==================================================== -->
  <!-- ROW 2, CARD 4: 1-Tap Instant Staff Handoff           -->
  <!-- ==================================================== -->
  <g transform="translate(460, 235)" filter="url(#card-drop)">
    <rect width="410" height="165" rx="16" fill="url(#card-surface)" stroke="rgba(160,201,185,0.25)" stroke-width="1.2" />

    <!-- Card Header -->
    <g transform="translate(18, 16)">
      <circle cx="12" cy="12" r="12" fill="#1D6D56" />
      <!-- Human User Glyph -->
      <circle cx="12" cy="9" r="3.5" fill="#FFFFFF" />
      <path d="M6 18 C6 15 9 14 12 14 C15 14 18 15 18 18" fill="#FFFFFF" />

      <text x="32" y="11" font-size="13" font-weight="700" fill="#FFFFFF">1-Tap Instant Staff Handoff</text>
      <text x="32" y="24" font-size="10.5" font-weight="500" fill="#A0C9B9">Takeover any chat anytime · 1-click return to bot</text>

      <rect x="290" y="2" width="76" height="20" rx="10" fill="rgba(217,119,54,0.2)" stroke="#D97736" stroke-width="0.8" />
      <text x="328" y="16" font-size="9" font-weight="700" fill="#F59E0B" text-anchor="middle">1-TAP PAUSE</text>
    </g>

    <!-- Interactive Graphic Area -->
    <g transform="translate(18, 54)">
      <!-- Left: Mini Chat Stream -->
      <g transform="translate(4, 6)">
        <rect width="115" height="60" rx="8" fill="#14362E" stroke="rgba(160,201,185,0.3)" stroke-width="1" />
        <rect x="8" y="8" width="75" height="18" rx="4" fill="#DCF8C6" />
        <text x="12" y="20" font-size="7.5" fill="#111827">"Special request..."</text>
        <rect x="25" y="32" width="82" height="20" rx="4" fill="#FFFFFF" />
        <text x="30" y="45" font-size="7.5" fill="#183F35">"Connecting staff..."</text>
      </g>

      <!-- Center: 1-Tap Takeover Switch -->
      <g transform="translate(132, 16)">
        <text class="toggle-state-ai" x="12" y="8" font-size="8" font-weight="700" fill="#A0C9B9" text-anchor="middle">BOT</text>
        
        <!-- Toggle Pill Track -->
        <rect x="0" y="14" width="48" height="24" rx="12" fill="#0C241D" stroke="#1D6D56" stroke-width="1.5" />
        <!-- Sliding Knob -->
        <circle class="toggle-knob" cx="12" cy="26" r="8" fill="#F59E0B" filter="url(#subtle-glow)" />

        <text class="toggle-state-human" x="36" y="8" font-size="8" font-weight="800" fill="#F59E0B" text-anchor="middle">STAFF</text>
      </g>

      <!-- Right: Handoff Status Card -->
      <g transform="translate(196, 6)">
        <rect width="170" height="60" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.2" />
        <rect width="170" height="18" rx="8" fill="#183F35" />
        <text x="8" y="13" font-size="8.5" font-weight="800" fill="#F59E0B">OWNER TAKEOVER ACTIVE</text>

        <text x="8" y="32" font-size="8" font-weight="600" fill="#1E293B">Staff is typing directly...</text>
        <text x="8" y="44" font-size="7.5" fill="#64748B">Bot paused silently for this chat</text>
        <text x="8" y="54" font-size="7.5" font-weight="700" fill="#22C55E">Tap to hand back to AI ↺</text>
      </g>
    </g>

    <!-- Bottom Stat Pill -->
    <text x="18" y="148" font-size="10" font-weight="600" fill="#A0C9B9">
      👑 The business owner always stays in control. No black-box automation.
    </text>
  </g>
</svg>