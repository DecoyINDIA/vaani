<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="100%" height="auto" role="img" aria-label="Vaani Liquid Glass CLI Workflow and Developer Setup">
  <defs>
    <!-- Deep Canvas & Glass Gradients -->
    <linearGradient id="termCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081A15" />
      <stop offset="50%" stop-color="#0A221C" />
      <stop offset="100%" stop-color="#05120E" />
    </linearGradient>

    <linearGradient id="termGlassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143D32" stop-opacity="0.82" />
      <stop offset="60%" stop-color="#0D2721" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#071713" stop-opacity="0.97" />
    </linearGradient>

    <!-- Specular Rim Gradient for Liquid Glass Finish -->
    <linearGradient id="termSpecularRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="20%" stop-color="#10B981" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#1D6D56" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15" />
    </linearGradient>

    <!-- Laser Beam Gradient for Perimeter Tracer -->
    <linearGradient id="laserBeamClip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0" />
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.9" />
      <stop offset="90%" stop-color="#34D399" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
    </linearGradient>

    <!-- 45-degree Sheen Sweep Gradient -->
    <linearGradient id="termSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="42%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="58%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="termHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18483C" />
      <stop offset="100%" stop-color="#10332A" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="auroraGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" />
    </filter>

    <filter id="glassShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <!-- Scanline Subtle Texture -->
    <pattern id="termScan" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#1D6D56" stroke-width="0.3" stroke-opacity="0.18" />
    </pattern>
  </defs>

  <style>
    <![CDATA[
    .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }

    /* Living Aurora Ambient Glows */
    .aurora-cli-1 {
      animation: auroraCli1 10s cubic-bezier(0.16, 1, 0.3, 1) infinite alternate;
    }
    @keyframes auroraCli1 {
      0% { transform: translate(140px, 90px) scale(1); opacity: 0.35; }
      100% { transform: translate(280px, 140px) scale(1.3); opacity: 0.55; }
    }

    .aurora-cli-2 {
      animation: auroraCli2 12s cubic-bezier(0.16, 1, 0.3, 1) infinite alternate;
    }
    @keyframes auroraCli2 {
      0% { transform: translate(680px, 240px) scale(1.1); opacity: 0.3; }
      100% { transform: translate(520px, 180px) scale(1.25); opacity: 0.5; }
    }

    /* Perimeter Border Laser Beam Tracer (React-Bits) */
    .cli-laser-tracer {
      stroke-dasharray: 120 720;
      animation: traceCliWindow 9s linear infinite;
    }
    @keyframes traceCliWindow {
      0% { stroke-dashoffset: 840; }
      100% { stroke-dashoffset: 0; }
    }

    /* 45-Degree Liquid Glass Sheen Sweep */
    .sheen-sweep {
      animation: sweepSheen 7s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }
    @keyframes sweepSheen {
      0%, 15% { transform: translateX(-350px) rotate(25deg); opacity: 0; }
      35% { opacity: 0.7; }
      55%, 100% { transform: translateX(650px) rotate(25deg); opacity: 0; }
    }

    /* Blinking Neon Terminal Cursor */
    .cursor-neon {
      animation: cursorBlink 0.75s steps(2, start) infinite;
    }
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 5px #10B981); }
      50% { opacity: 0; }
    }

    /* Kinetic Command Execution Timeline (16s cycle) */
    .step-1-cmd  { animation: animStep1Cmd 16s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    .step-1-out  { animation: animStep1Out 16s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    .step-2-cmd  { animation: animStep2Cmd 16s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    .step-2-out  { animation: animStep2Out 16s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    .step-3-cmd  { animation: animStep3Cmd 16s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    .step-3-out  { animation: animStep3Out 16s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    .step-4-cmd  { animation: animStep4Cmd 16s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    .step-4-out  { animation: animStep4Out 16s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    .step-5-cmd  { animation: animStep5Cmd 16s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    .step-5-out  { animation: animStep5Out 16s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    .step-final  { animation: animStepFinal 16s cubic-bezier(0.16, 1, 0.3, 1) infinite; }

    @keyframes animStep1Cmd {
      0% { opacity: 0; transform: translateY(3px); }
      2% { opacity: 1; transform: translateY(0); }
      96% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes animStep1Out {
      0%, 6% { opacity: 0; }
      8% { opacity: 1; }
      96% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes animStep2Cmd {
      0%, 14% { opacity: 0; transform: translateY(3px); }
      17% { opacity: 1; transform: translateY(0); }
      96% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes animStep2Out {
      0%, 22% { opacity: 0; }
      25% { opacity: 1; }
      96% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes animStep3Cmd {
      0%, 31% { opacity: 0; transform: translateY(3px); }
      34% { opacity: 1; transform: translateY(0); }
      96% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes animStep3Out {
      0%, 39% { opacity: 0; }
      42% { opacity: 1; }
      96% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes animStep4Cmd {
      0%, 48% { opacity: 0; transform: translateY(3px); }
      51% { opacity: 1; transform: translateY(0); }
      96% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes animStep4Out {
      0%, 56% { opacity: 0; }
      59% { opacity: 1; }
      96% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes animStep5Cmd {
      0%, 65% { opacity: 0; transform: translateY(3px); }
      68% { opacity: 1; transform: translateY(0); }
      96% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes animStep5Out {
      0%, 73% { opacity: 0; }
      76% { opacity: 1; }
      96% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes animStepFinal {
      0%, 82% { opacity: 0; }
      85% { opacity: 1; }
      96% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* Radar Ping on Environment Badge */
    .radar-cli {
      animation: radarPingCli 2.2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }
    @keyframes radarPingCli {
      0% { r: 3.5px; opacity: 1; stroke-width: 1.5px; }
      70% { r: 10px; opacity: 0; stroke-width: 0.5px; }
      100% { r: 3.5px; opacity: 0; }
    }

    /* Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
      .cli-laser-tracer, .radar-cli, .sheen-sweep {
        display: none !important;
      }
      .cursor-neon { opacity: 1 !important; }
    }
    ]]>
  </style>

  <!-- ==================== LIVING AURORA BACKDROP ==================== -->
  <rect width="840" height="360" rx="14" fill="url(#termCanvas)" stroke="#1D6D56" stroke-width="1.5" />
  
  <g filter="url(#auroraGlow)">
    <circle cx="160" cy="110" r="100" fill="#10B981" class="aurora-cli-1" />
    <circle cx="680" cy="240" r="110" fill="#D97736" class="aurora-cli-2" />
  </g>

  <!-- ==================== LIQUID GLASS TERMINAL WINDOW ==================== -->
  <g transform="translate(10, 10)">
    <!-- Glass Terminal Frame with Specular Rim -->
    <rect width="820" height="340" rx="12" fill="url(#termGlassGrad)" stroke="url(#termSpecularRim)" stroke-width="1.5" filter="url(#glassShadow)" />
    
    <!-- React-Bits Laser Beam Tracer running around perimeter -->
    <rect width="820" height="340" rx="12" fill="none" stroke="url(#laserBeamClip)" stroke-width="2" class="cli-laser-tracer" filter="url(#neonGlow)" />

    <!-- 45-degree Sheen Sweep -->
    <g clip-path="url(#termClip)">
      <clipPath id="termClip">
        <rect width="820" height="340" rx="12" />
      </clipPath>
      <rect x="-100" y="-50" width="180" height="420" fill="url(#termSheen)" class="sheen-sweep" />
    </g>

    <!-- Scanline Texture Overlay -->
    <rect width="820" height="340" rx="12" fill="url(#termScan)" opacity="0.6" />

    <!-- ==================== WINDOW CHROME TITLEBAR ==================== -->
    <g id="window-chrome">
      <rect width="820" height="34" rx="12" fill="url(#termHeaderGrad)" />
      <rect y="22" width="820" height="12" fill="url(#termHeaderGrad)" />
      <line x1="0" y1="34" x2="820" y2="34" stroke="#1D6D56" stroke-width="1" />

      <!-- macOS Traffic Lights with Specular Depth -->
      <circle cx="20" cy="17" r="5.5" fill="#EF4444" stroke="#B91C1C" stroke-width="0.6" />
      <circle cx="38" cy="17" r="5.5" fill="#F59E0B" stroke="#B45309" stroke-width="0.6" />
      <circle cx="56" cy="17" r="5.5" fill="#10B981" stroke="#047857" stroke-width="0.6" />

      <!-- Center Title -->
      <text x="410" y="22" text-anchor="middle" class="font-mono" font-size="11.5" font-weight="600" fill="#FFFFFF" letter-spacing="0.3">
        vaani-core: dev-terminal ~ bash (zsh)
      </text>

      <!-- Right Telemetry Badge -->
      <g transform="translate(636, 8)">
        <rect width="170" height="18" rx="9" fill="#0C201B" stroke="#1D6D56" stroke-width="0.8" />
        <circle cx="12" cy="9" r="3.5" fill="#10B981" />
        <circle cx="12" cy="9" r="3.5" fill="none" stroke="#10B981" class="radar-cli" />
        <text x="22" y="12.5" class="font-mono" font-size="9" font-weight="700" fill="#A0C9B9">Python 3.11 • uv v0.5</text>
      </g>
    </g>

    <!-- ==================== TERMINAL CODE STREAM ==================== -->
    <g id="terminal-content" transform="translate(20, 56)">

      <!-- LINE 1: git clone -->
      <g class="step-1-cmd" transform="translate(0, 0)">
        <text class="font-mono" font-size="12">
          <tspan fill="#10B981" font-weight="800">❯</tspan>
          <tspan fill="#D97736" font-weight="800"> git</tspan>
          <tspan fill="#FFFFFF"> clone https://github.com/DecoyINDIA/vaani.git &amp;&amp; cd vaani</tspan>
        </text>
      </g>
      <g class="step-1-out" transform="translate(0, 18)">
        <text class="font-mono" font-size="11">
          <tspan fill="#64748B">remote: </tspan>
          <tspan fill="#A0C9B9">Enumerating objects: 1240, done. | Total 1240 (delta 812) [1.4 MB/s]</tspan>
        </text>
      </g>

      <!-- LINE 2: uv sync -->
      <g class="step-2-cmd" transform="translate(0, 48)">
        <text class="font-mono" font-size="12">
          <tspan fill="#10B981" font-weight="800">vaani ❯</tspan>
          <tspan fill="#D97736" font-weight="800"> uv</tspan>
          <tspan fill="#FFFFFF"> sync </tspan>
          <tspan fill="#A0C9B9">--frozen</tspan>
        </text>
      </g>
      <g class="step-2-out" transform="translate(0, 66)">
        <text class="font-mono" font-size="11">
          <tspan fill="#10B981" font-weight="800">✓</tspan>
          <tspan fill="#FFFFFF"> Resolved </tspan>
          <tspan fill="#F59E0B" font-weight="700">48 packages</tspan>
          <tspan fill="#EFECE6"> in 420ms | Installed 48 packages in 1.12s</tspan>
        </text>
      </g>

      <!-- LINE 3: npm run build -->
      <g class="step-3-cmd" transform="translate(0, 96)">
        <text class="font-mono" font-size="12">
          <tspan fill="#10B981" font-weight="800">vaani ❯</tspan>
          <tspan fill="#D97736" font-weight="800"> npm</tspan>
          <tspan fill="#A0C9B9"> --prefix dashboard</tspan>
          <tspan fill="#FFFFFF"> run build</tspan>
        </text>
      </g>
      <g class="step-3-out" transform="translate(0, 114)">
        <text class="font-mono" font-size="11">
          <tspan fill="#10B981" font-weight="800">✓</tspan>
          <tspan fill="#FFFFFF"> Built Vite bundle in </tspan>
          <tspan fill="#A0C9B9">1.84s</tspan>
          <tspan fill="#64748B"> (dist/assets/index-D8x2a.js: </tspan>
          <tspan fill="#10B981" font-weight="700">234 kB gzip</tspan>
          <tspan fill="#64748B">)</tspan>
        </text>
      </g>

      <!-- LINE 4: pytest -->
      <g class="step-4-cmd" transform="translate(0, 144)">
        <text class="font-mono" font-size="12">
          <tspan fill="#10B981" font-weight="800">vaani ❯</tspan>
          <tspan fill="#D97736" font-weight="800"> uv</tspan>
          <tspan fill="#FFFFFF"> run pytest </tspan>
          <tspan fill="#A0C9B9">-q</tspan>
        </text>
      </g>
      <g class="step-4-out" transform="translate(0, 162)">
        <text class="font-mono" font-size="11">
          <tspan fill="#10B981" font-weight="800">✓ 386 passed</tspan>
          <tspan fill="#EFECE6"> in 17.69s (</tspan>
          <tspan fill="#F59E0B" font-weight="800">100% test integrity</tspan>
          <tspan fill="#EFECE6"> • 0 flaky • 0 skipped)</tspan>
        </text>
      </g>

      <!-- LINE 5: uvicorn startup -->
      <g class="step-5-cmd" transform="translate(0, 192)">
        <text class="font-mono" font-size="12">
          <tspan fill="#10B981" font-weight="800">vaani ❯</tspan>
          <tspan fill="#D97736" font-weight="800"> uv</tspan>
          <tspan fill="#FFFFFF"> run uvicorn app.main:app </tspan>
          <tspan fill="#A0C9B9">--port 8000</tspan>
        </text>
      </g>
      <g class="step-5-out" transform="translate(0, 210)">
        <text class="font-mono" font-size="11">
          <tspan fill="#10B981" font-weight="800">INFO:</tspan>
          <tspan fill="#FFFFFF">     Application startup complete. Ready on </tspan>
          <tspan fill="#38BDF8" text-decoration="underline">http://localhost:8000</tspan>
        </text>
      </g>

      <!-- Active Final Prompt with Blinking Neon Cursor -->
      <g class="step-final" transform="translate(0, 238)">
        <text class="font-mono" font-size="12">
          <tspan fill="#10B981" font-weight="800">vaani (main) ❯ </tspan>
          <tspan fill="#10B981" class="cursor-neon">█</tspan>
        </text>
      </g>
    </g>

    <!-- ==================== LIQUID GLASS FOOTER STATUS BAR ==================== -->
    <g id="terminal-footer" transform="translate(0, 306)">
      <line x1="0" y1="0" x2="820" y2="0" stroke="#1D6D56" stroke-width="1" />
      <rect y="1" width="820" height="33" rx="0" fill="#0A221C" />

      <!-- Left Status -->
      <g transform="translate(16, 21)">
        <circle cx="4" cy="0" r="3.5" fill="#10B981" />
        <text x="14" y="3.5" class="font-mono" font-size="9.5" font-weight="700" fill="#A0C9B9">PORT: 8000 [LISTENING]</text>
      </g>

      <!-- Center Telemetry -->
      <g transform="translate(320, 21)">
        <text class="font-mono" font-size="9.5" fill="#FFFFFF">
          <tspan fill="#64748B">STATE: </tspan>
          <tspan fill="#10B981" font-weight="700">HEALTHY</tspan>
          <tspan fill="#64748B"> • MEM: </tspan>
          <tspan fill="#A0C9B9">64.2 MB</tspan>
          <tspan fill="#64748B"> • LATENCY: </tspan>
          <tspan fill="#F59E0B" font-weight="700">p50 &lt; 3s</tspan>
        </text>
      </g>

      <!-- Right Quick Action -->
      <g transform="translate(714, 11)">
        <rect width="90" height="20" rx="4" fill="#184337" stroke="#1D6D56" stroke-width="0.8" />
        <text x="45" y="14" text-anchor="middle" class="font-mono" font-size="9" font-weight="800" fill="#10B981">GET /docs</text>
      </g>
    </g>
  </g>
</svg>