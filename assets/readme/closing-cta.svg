<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="auto" role="img" aria-label="Vaani Closing Showcase Call to Action">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2822" />
      <stop offset="50%" stop-color="#12352C" />
      <stop offset="100%" stop-color="#091A16" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#1D6D56" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0E2822" stop-opacity="0" />
    </radialGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#153D33" />
      <stop offset="100%" stop-color="#0F2B24" />
    </linearGradient>

    <linearGradient id="starCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A493D" />
      <stop offset="100%" stop-color="#11332A" />
    </linearGradient>

    <!-- Star Glow -->
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <!-- Background Grid -->
    <pattern id="ctaGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1D6D56" stroke-width="0.5" stroke-opacity="0.16" />
    </pattern>
  </defs>

  <style>
    <![CDATA[
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }

    /* Radar Ping Animation for Pilot Enrolment */
    .radar-pulse {
      animation: radarExpand 2.2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    @keyframes radarExpand {
      0% { r: 3.5px; opacity: 1; stroke-width: 1.5px; }
      75% { r: 12px; opacity: 0; stroke-width: 0.5px; }
      100% { r: 3.5px; opacity: 0; }
    }

    /* Star Breathing Pulse */
    .star-pulse {
      animation: starBreath 2.5s ease-in-out infinite alternate;
      transform-origin: 450px 146px;
    }
    @keyframes starBreath {
      0% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(245, 158, 11, 0.4)); }
      100% { transform: scale(1.12); filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.9)); }
    }

    /* Star Button Glow */
    .btn-glow {
      animation: buttonPulse 3s ease-in-out infinite alternate;
    }
    @keyframes buttonPulse {
      0% { stroke: #D97736; stroke-width: 1; }
      100% { stroke: #F59E0B; stroke-width: 1.8; filter: drop-shadow(0 0 6px rgba(217, 119, 54, 0.6)); }
    }

    /* Card Hover / Breathing Border */
    .live-card {
      animation: cardBorderGlow 4s ease-in-out infinite alternate;
    }
    @keyframes cardBorderGlow {
      0% { stroke: #1D6D56; }
      100% { stroke: #10B981; }
    }

    /* Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transform: none !important;
      }
      .radar-pulse { display: none !important; }
    }
    ]]>
  </style>

  <!-- Canvas Outer Background -->
  <rect width="900" height="260" rx="14" fill="url(#bgGrad)" stroke="#1D6D56" stroke-width="1.5" />
  <rect width="900" height="260" rx="14" fill="url(#centerGlow)" />
  <rect width="900" height="260" rx="14" fill="url(#ctaGrid)" />

  <!-- ==================== TOP BANNER & HEADLINE ==================== -->
  <g id="top-showcase" transform="translate(0, 16)">
    <!-- Pulsing Live Pilot Enrolment Pill -->
    <g transform="translate(262, 0)">
      <rect width="376" height="26" rx="13" fill="#10332A" stroke="#10B981" stroke-width="0.9" />
      <circle cx="18" cy="13" r="3.5" fill="#10B981" />
      <circle cx="18" cy="13" r="3.5" fill="none" stroke="#10B981" class="radar-pulse" />
      <text x="32" y="17" class="font-sans" font-size="10.5" font-weight="700" fill="#EFECE6" letter-spacing="0.3">
        Bhubaneswar &amp; Pan-India Pilot Enrolment Open
      </text>
      <rect x="306" y="4" width="60" height="18" rx="4" fill="#18493C" />
      <text x="336" y="16.5" text-anchor="middle" class="font-mono" font-size="8" font-weight="700" fill="#10B981">BATCH #04</text>
    </g>

    <!-- Main Headline -->
    <text x="450" y="58" text-anchor="middle" class="font-sans" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="-0.3">
      Your business, always answered.
    </text>

    <!-- Subtitle -->
    <text x="450" y="80" text-anchor="middle" class="font-sans" font-size="11.5" font-weight="400" fill="#A0C9B9">
      Vernacular AI front desk infrastructure for healthcare, retail, and local enterprise across Bharat.
    </text>
  </g>

  <!-- ==================== THREE SHOWCASE CARDS ==================== -->
  <g id="cards-row" transform="translate(24, 112)">

    <!-- CARD 1: FOUNDER / ARCHITECT (XOLVER) -->
    <g transform="translate(0, 0)">
      <rect width="272" height="132" rx="9" fill="url(#cardGrad)" stroke="#1D6D56" stroke-width="1.2" filter="url(#boxShadow)" />
      
      <!-- Top mini-pill -->
      <g transform="translate(14, 12)">
        <rect width="138" height="18" rx="4" fill="#0E2822" stroke="#1D6D56" stroke-width="0.7" />
        <text x="69" y="12.5" text-anchor="middle" class="font-mono" font-size="8" font-weight="700" fill="#A0C9B9">ARCHITECT &amp; PILOTS</text>
      </g>

      <!-- Subham Jena & Xolver -->
      <text x="14" y="50" class="font-sans" font-size="13" font-weight="800" fill="#FFFFFF">Subham Jena • Xolver</text>
      <text x="14" y="66" class="font-sans" font-size="9.5" fill="#EFECE6">High-throughput voice &amp; messaging AI</text>
      
      <line x1="14" y1="78" x2="258" y2="78" stroke="#1D6D56" stroke-width="0.8" stroke-opacity="0.6" />

      <!-- Contact Metadata -->
      <g transform="translate(14, 94)">
        <circle cx="4" cy="0" r="2.5" fill="#10B981" />
        <text x="12" y="3" class="font-mono" font-size="8.5" fill="#A0C9B9">Base: Bhubaneswar, Odisha, India</text>
      </g>
      <g transform="translate(14, 114)">
        <circle cx="4" cy="0" r="2.5" fill="#D97736" />
        <text x="12" y="3" class="font-mono" font-size="8.5" fill="#EFECE6">GitHub: @DecoyINDIA • Xolver AI</text>
      </g>
    </g>

    <!-- CARD 2: STAR THIS REPOSITORY (CALL TO ACTION) -->
    <g transform="translate(290, 0)">
      <rect width="272" height="132" rx="9" fill="url(#starCardGrad)" class="live-card" stroke-width="1.5" filter="url(#boxShadow)" />
      
      <!-- Star Icon & Headline -->
      <g transform="translate(14, 14)">
        <!-- Animated Star SVG Glyph -->
        <g class="star-pulse" transform="translate(10, 8)">
          <path d="M 0 -7 L 2 -2 L 7 -2 L 3 1 L 5 6 L 0 3 L -5 6 L -3 1 L -7 -2 L -2 -2 Z" fill="#F59E0B" stroke="#D97706" stroke-width="0.5" filter="url(#starGlow)" />
        </g>
        <text x="30" y="14" class="font-sans" font-size="13.5" font-weight="800" fill="#FFFFFF">Star this repository</text>
        <text x="0" y="34" class="font-sans" font-size="9.5" fill="#EFECE6">Help bring voice AI to every Indian clinic &amp; shop</text>
      </g>

      <!-- Badges row -->
      <g transform="translate(14, 62)">
        <rect width="68" height="18" rx="4" fill="#0E2822" stroke="#1D6D56" stroke-width="0.7" />
        <text x="34" y="12" text-anchor="middle" class="font-mono" font-size="7.5" fill="#10B981">MIT License</text>

        <rect x="74" y="0" width="82" height="18" rx="4" fill="#0E2822" stroke="#1D6D56" stroke-width="0.7" />
        <text x="115" y="12" text-anchor="middle" class="font-mono" font-size="7.5" fill="#A0C9B9">Open Source</text>

        <rect x="162" y="0" width="80" height="18" rx="4" fill="#0E2822" stroke="#1D6D56" stroke-width="0.7" />
        <text x="202" y="12" text-anchor="middle" class="font-mono" font-size="7.5" fill="#F59E0B">Fork &amp; Build</text>
      </g>

      <!-- Interactive Button Action -->
      <g transform="translate(14, 90)">
        <rect width="244" height="28" rx="6" fill="#D97736" class="btn-glow" />
        <text x="122" y="18" text-anchor="middle" class="font-sans" font-size="10.5" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">
          ★ Star on GitHub /DecoyINDIA/vaani
        </text>
      </g>
    </g>

    <!-- CARD 3: DPDP 2025 COMPLIANCE SEAL -->
    <g transform="translate(580, 0)">
      <rect width="272" height="132" rx="9" fill="url(#cardGrad)" stroke="#1D6D56" stroke-width="1.2" filter="url(#boxShadow)" />
      
      <!-- Header with Shield Icon -->
      <g transform="translate(14, 14)">
        <!-- Shield Icon -->
        <path d="M 12 2 L 20 5 L 20 13 Q 20 20 12 24 Q 4 20 4 13 L 4 5 Z" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1.2" />
        <path d="M 8 13 L 11 16 L 16 9" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />

        <text x="28" y="14" class="font-sans" font-size="12" font-weight="800" fill="#10B981">DPDP 2025 COMPLIANT</text>
        <text x="28" y="24" class="font-sans" font-size="8.5" fill="#A0C9B9">Digital Personal Data Protection Act</text>
      </g>

      <line x1="14" y1="46" x2="258" y2="46" stroke="#1D6D56" stroke-width="0.8" stroke-opacity="0.6" />

      <!-- Compliance Checkpoints -->
      <g transform="translate(14, 60)">
        <circle cx="4" cy="0" r="2.5" fill="#10B981" />
        <text x="12" y="3" class="font-sans" font-size="8.5" font-weight="600" fill="#FFFFFF">Zero Plaintext Patient PII</text>
        <text x="12" y="13" class="font-sans" font-size="7.5" fill="#A0C9B9">SHA256 salted tokens, ephemeral state</text>
      </g>

      <g transform="translate(14, 86)">
        <circle cx="4" cy="0" r="2.5" fill="#10B981" />
        <text x="12" y="3" class="font-sans" font-size="8.5" font-weight="600" fill="#FFFFFF">30-Day Auto-Purge Audit Logs</text>
        <text x="12" y="13" class="font-sans" font-size="7.5" fill="#A0C9B9">MongoDB TTL index with immutable logs</text>
      </g>

      <g transform="translate(14, 112)">
        <circle cx="4" cy="0" r="2.5" fill="#10B981" />
        <text x="12" y="3" class="font-sans" font-size="8.5" font-weight="600" fill="#FFFFFF">Strict In-Domain Scope Enforcement</text>
      </g>
    </g>
  </g>
</svg>