<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="auto" role="img" aria-label="Vaani Liquid Glass Closing Showcase Call to Action">
  <defs>
    <!-- Background Canvas & Living Aurora Gradients -->
    <linearGradient id="ctaCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081A15" />
      <stop offset="50%" stop-color="#0D2720" />
      <stop offset="100%" stop-color="#05120E" />
    </linearGradient>

    <!-- Liquid Glass Surface Gradient -->
    <linearGradient id="ctaGlassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#164539" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0E2F27" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#081E19" stop-opacity="0.96" />
    </linearGradient>

    <!-- Specular Rim Gradient for Refractive Glass Edges -->
    <linearGradient id="ctaSpecularRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7" />
      <stop offset="25%" stop-color="#10B981" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#1D6D56" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15" />
    </linearGradient>

    <!-- Specular Gold Rim for Star Card -->
    <linearGradient id="ctaSpecularGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75" />
      <stop offset="30%" stop-color="#F59E0B" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#D97736" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.25" />
    </linearGradient>

    <!-- Laser Beam Clip Gradient for Star Card Perimeter Tracer -->
    <linearGradient id="laserBeamStar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.9" />
      <stop offset="85%" stop-color="#FDE68A" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
    </linearGradient>

    <!-- 45-degree Glass Sheen Gradient -->
    <linearGradient id="ctaSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="44%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="56%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Button Gradient -->
    <linearGradient id="starBtnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97736" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Filters: Neon Glow, Aurora Blur & Glass Shadow -->
    <filter id="neonCta" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="auroraBlurCta" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38" />
    </filter>

    <filter id="ctaShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Matrix Pattern -->
    <pattern id="ctaMatrix" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#1D6D56" stroke-width="0.5" stroke-opacity="0.18" />
      <circle cx="0" cy="0" r="0.8" fill="#10B981" fill-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    <![CDATA[
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }

    /* Living Aurora Ambient Glows */
    .aurora-cta-1 {
      animation: auroraCta1 11s cubic-bezier(0.16, 1, 0.3, 1) infinite alternate;
    }
    @keyframes auroraCta1 {
      0% { transform: translate(160px, 60px) scale(1); opacity: 0.35; }
      100% { transform: translate(320px, 120px) scale(1.3); opacity: 0.6; }
    }

    .aurora-cta-2 {
      animation: auroraCta2 13s cubic-bezier(0.16, 1, 0.3, 1) infinite alternate;
    }
    @keyframes auroraCta2 {
      0% { transform: translate(720px, 180px) scale(1.1); opacity: 0.3; }
      100% { transform: translate(560px, 120px) scale(1.35); opacity: 0.55; }
    }

    /* Radar Ping on Pilot Enrolment Capsule */
    .radar-cta {
      animation: radarCtaPing 2.4s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }
    @keyframes radarCtaPing {
      0% { r: 3.5px; opacity: 1; stroke-width: 1.5px; }
      75% { r: 12px; opacity: 0; stroke-width: 0.5px; }
      100% { r: 3.5px; opacity: 0; }
    }

    /* Perimeter Border Laser Beam Tracer on Star Card (React-Bits) */
    .star-laser-tracer {
      stroke-dasharray: 90 450;
      animation: traceStarBox 7s linear infinite;
    }
    @keyframes traceStarBox {
      0% { stroke-dashoffset: 540; }
      100% { stroke-dashoffset: 0; }
    }

    /* 45-degree Glass Sheen Sweep */
    .sheen-cta-sweep {
      animation: sweepCtaSheen 6s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }
    @keyframes sweepCtaSheen {
      0%, 15% { transform: translateX(-300px) rotate(25deg); opacity: 0; }
      35% { opacity: 0.75; }
      55%, 100% { transform: translateX(550px) rotate(25deg); opacity: 0; }
    }

    /* Animated Gold Star Breathing Pulse with GSAP Overshoot */
    .star-pulse-gsap {
      animation: starBreathGsap 2.6s cubic-bezier(0.34, 1.56, 0.64, 1) infinite alternate;
      transform-origin: 10px 8px;
    }
    @keyframes starBreathGsap {
      0% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(245, 158, 11, 0.5)); }
      100% { transform: scale(1.15); filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.95)); }
    }

    /* Button Glow Pulse */
    .star-btn-pulse {
      animation: btnPulse 3s cubic-bezier(0.16, 1, 0.3, 1) infinite alternate;
    }
    @keyframes btnPulse {
      0% { filter: drop-shadow(0 0 2px rgba(217, 119, 54, 0.4)); }
      100% { filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.75)); }
    }

    /* Accessibility: Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transform: none !important;
      }
      .star-laser-tracer, .radar-cta, .sheen-cta-sweep {
        display: none !important;
      }
    }
    ]]>
  </style>

  <!-- ==================== LIVING AURORA BACKDROP ==================== -->
  <rect width="900" height="260" rx="16" fill="url(#ctaCanvas)" stroke="#1D6D56" stroke-width="1.5" />
  
  <g filter="url(#auroraBlurCta)">
    <circle cx="180" cy="80" r="100" fill="#10B981" class="aurora-cta-1" />
    <circle cx="720" cy="180" r="110" fill="#D97736" class="aurora-cta-2" />
  </g>

  <rect width="900" height="260" rx="16" fill="url(#ctaMatrix)" />

  <!-- ==================== TOP BANNER & HEADLINE ==================== -->
  <g id="top-showcase" transform="translate(0, 16)">
    <!-- Pulsing Live Pilot Enrolment Pill -->
    <g transform="translate(256, 0)">
      <rect width="388" height="28" rx="14" fill="url(#ctaGlassGrad)" stroke="url(#ctaSpecularRim)" stroke-width="1" filter="url(#ctaShadow)" />
      <circle cx="18" cy="14" r="3.5" fill="#10B981" />
      <circle cx="18" cy="14" r="3.5" fill="none" stroke="#10B981" class="radar-cta" />
      <text x="32" y="18" class="font-sans" font-size="10.5" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">
        Bhubaneswar &amp; Pan-India Pilot Enrolment Open
      </text>
      <rect x="316" y="5" width="60" height="18" rx="4" fill="#18493C" />
      <text x="346" y="17.5" text-anchor="middle" class="font-mono" font-size="8" font-weight="800" fill="#10B981">BATCH #04</text>
    </g>

    <!-- Main Headline with Crisp Typography -->
    <text x="450" y="58" text-anchor="middle" class="font-sans" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="-0.3">
      Your business, always answered.
    </text>

    <!-- Subtitle -->
    <text x="450" y="80" text-anchor="middle" class="font-sans" font-size="11.5" font-weight="400" fill="#A0C9B9">
      Autonomous multi-lingual reception for healthcare, retail, and local enterprise across Bharat.
    </text>
  </g>

  <!-- ==================== THREE LIQUID GLASS CARDS ==================== -->
  <g id="cards-row" transform="translate(24, 110)">

    <!-- CARD 1: FOUNDER & ARCHITECT (SUBHAM JENA • XOLVER) -->
    <g transform="translate(0, 0)">
      <rect width="272" height="134" rx="10" fill="url(#ctaGlassGrad)" stroke="url(#ctaSpecularRim)" stroke-width="1.2" filter="url(#ctaShadow)" />

      <!-- Top Mini-Pill -->
      <g transform="translate(14, 12)">
        <rect width="138" height="18" rx="4" fill="#0C201B" stroke="#1D6D56" stroke-width="0.7" />
        <text x="69" y="12.5" text-anchor="middle" class="font-mono" font-size="8" font-weight="700" fill="#A0C9B9">ARCHITECT &amp; PILOTS</text>
      </g>

      <!-- Subham Jena & Xolver Details -->
      <text x="14" y="50" class="font-sans" font-size="13" font-weight="800" fill="#FFFFFF">Subham Jena • Xolver</text>
      <text x="14" y="66" class="font-sans" font-size="9.5" fill="#EFECE6">High-throughput voice &amp; messaging AI</text>
      
      <line x1="14" y1="78" x2="258" y2="78" stroke="#1D6D56" stroke-width="0.8" stroke-opacity="0.6" />

      <!-- Contact Metadata -->
      <g transform="translate(14, 94)">
        <circle cx="4" cy="0" r="2.5" fill="#10B981" />
        <text x="12" y="3" class="font-mono" font-size="8.5" fill="#A0C9B9">Base: Bhubaneswar, Odisha, India</text>
      </g>
      <g transform="translate(14, 114)">
        <circle cx="4" cy="0" r="2.5" fill="#D97736" />
        <text x="12" y="3" class="font-mono" font-size="8.5" fill="#EFECE6">GitHub: @DecoyINDIA • Xolver AI</text>
      </g>
    </g>

    <!-- CARD 2: STAR THIS REPOSITORY (REACT-BITS LASER TRACER + SHEEN) -->
    <g transform="translate(290, 0)">
      <rect width="272" height="134" rx="10" fill="url(#ctaGlassGrad)" stroke="url(#ctaSpecularGold)" stroke-width="1.5" filter="url(#ctaShadow)" />
      
      <!-- React-Bits Laser Beam Tracer running around Star Card perimeter -->
      <rect width="272" height="134" rx="10" fill="none" stroke="url(#laserBeamStar)" stroke-width="2" class="star-laser-tracer" filter="url(#neonCta)" />

      <!-- 45-degree Glass Sheen Sweep -->
      <g clip-path="url(#starClip)">
        <clipPath id="starClip">
          <rect width="272" height="134" rx="10" />
        </clipPath>
        <rect x="-80" y="-40" width="120" height="220" fill="url(#ctaSheen)" class="sheen-cta-sweep" />
      </g>

      <!-- Star Icon & Headline -->
      <g transform="translate(14, 14)">
        <!-- Animated GSAP Star SVG Glyph -->
        <g class="star-pulse-gsap" transform="translate(10, 8)">
          <path d="M 0 -7 L 2 -2 L 7 -2 L 3 1 L 5 6 L 0 3 L -5 6 L -3 1 L -7 -2 L -2 -2 Z" fill="#F59E0B" stroke="#D97706" stroke-width="0.5" />
        </g>
        <text x="30" y="14" class="font-sans" font-size="13.5" font-weight="800" fill="#FFFFFF">Star this repository</text>
        <text x="0" y="34" class="font-sans" font-size="9.5" fill="#EFECE6">Help bring voice AI to every Indian clinic &amp; shop</text>
      </g>

      <!-- Badges Row -->
      <g transform="translate(14, 64)">
        <rect width="68" height="18" rx="4" fill="#0C201B" stroke="#1D6D56" stroke-width="0.7" />
        <text x="34" y="12" text-anchor="middle" class="font-mono" font-size="7.5" fill="#10B981">MIT License</text>

        <rect x="74" y="0" width="82" height="18" rx="4" fill="#0C201B" stroke="#1D6D56" stroke-width="0.7" />
        <text x="115" y="12" text-anchor="middle" class="font-mono" font-size="7.5" fill="#A0C9B9">Open Source</text>

        <rect x="162" y="0" width="80" height="18" rx="4" fill="#0C201B" stroke="#1D6D56" stroke-width="0.7" />
        <text x="202" y="12" text-anchor="middle" class="font-mono" font-size="7.5" fill="#F59E0B">Fork &amp; Build</text>
      </g>

      <!-- Interactive Button Action -->
      <g transform="translate(14, 92)">
        <rect width="244" height="28" rx="6" fill="url(#starBtnGrad)" class="star-btn-pulse" />
        <text x="122" y="18" text-anchor="middle" class="font-sans" font-size="10.5" font-weight="800" fill="#FFFFFF" letter-spacing="0.3">
          ★ Star on GitHub /DecoyINDIA/vaani
        </text>
      </g>
    </g>

    <!-- CARD 3: DPDP 2025 COMPLIANCE SEAL -->
    <g transform="translate(580, 0)">
      <rect width="272" height="134" rx="10" fill="url(#ctaGlassGrad)" stroke="url(#ctaSpecularRim)" stroke-width="1.2" filter="url(#ctaShadow)" />

      <!-- Header with Shield Icon -->
      <g transform="translate(14, 14)">
        <!-- Shield Icon with Checkmark -->
        <path d="M 12 2 L 20 5 L 20 13 Q 20 20 12 24 Q 4 20 4 13 L 4 5 Z" fill="#10B981" fill-opacity="0.25" stroke="#10B981" stroke-width="1.2" />
        <path d="M 8 13 L 11 16 L 16 9" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />

        <text x="28" y="14" class="font-sans" font-size="12" font-weight="800" fill="#10B981">DPDP 2025 COMPLIANT</text>
        <text x="28" y="24" class="font-sans" font-size="8.5" fill="#A0C9B9">Digital Personal Data Protection Act</text>
      </g>

      <line x1="14" y1="46" x2="258" y2="46" stroke="#1D6D56" stroke-width="0.8" stroke-opacity="0.6" />

      <!-- Compliance Checkpoints -->
      <g transform="translate(14, 60)">
        <circle cx="4" cy="0" r="2.5" fill="#10B981" />
        <text x="12" y="3" class="font-sans" font-size="8.5" font-weight="700" fill="#FFFFFF">Zero Plaintext Patient PII</text>
        <text x="12" y="13" class="font-sans" font-size="7.5" fill="#A0C9B9">SHA256 salted tokens, ephemeral state</text>
      </g>

      <g transform="translate(14, 86)">
        <circle cx="4" cy="0" r="2.5" fill="#10B981" />
        <text x="12" y="3" class="font-sans" font-size="8.5" font-weight="700" fill="#FFFFFF">30-Day Auto-Purge Audit Logs</text>
        <text x="12" y="13" class="font-sans" font-size="7.5" fill="#A0C9B9">MongoDB TTL index with immutable logs</text>
      </g>

      <g transform="translate(14, 112)">
        <circle cx="4" cy="0" r="2.5" fill="#10B981" />
        <text x="12" y="3" class="font-sans" font-size="8.5" font-weight="700" fill="#FFFFFF">Strict In-Domain Scope Enforcement</text>
      </g>
    </g>
  </g>
</svg>