[project]
name = "vaani"
version = "0.1.0"
description = "Vernacular AI front-desk agent (WhatsApp + voice) for Indian appointment-driven SMBs. v1 vertical: clinics."
authors = [{ name = "Subham Jena", email = "subhamjena.j@gmail.com" }]
requires-python = ">=3.12"
readme = "README.md"

# Runtime deps — kept minimal per TRD §8 (build the agent core, buy everything else).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",      # app/config.py — all env in one place
    "httpx>=0.27",                 # BSP / Razorpay / OpenRouter calls
    "motor>=3.6",                  # async MongoDB Atlas driver (ADR-03)
    "redis>=5.2",                  # Streams queue, slot locks, session cache (ADR-03)
    "langgraph>=0.2",              # agent state machine (ADR-01)
    "langchain-core>=0.3",
    "lingua-language-detector>=2.0",  # language detection (TRD §4.3)
    "PyJWT>=2.10",                  # JWT for owner_api (TRD §6)
    "python-multipart>=0.0.9",
    "tzdata>=2025.2",               # IANA zones for Windows/minimal containers
    "sentry-sdk>=2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mongomock-motor>=0.0.34",     # tenant-isolation + accessor tests without a live cluster
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "evals", "ops", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Custom rule (enforced in review + CI, see 06-engineering-plan §0 rule 1):
# raw `db[...].find` outside app/models/ is forbidden — greppable in ci.yml.

[tool.ruff.lint.per-file-ignores]
# Line-length is enforced on core logic. It is NOT enforced where a line is a
# single indivisible string literal — i18n message tables, few-shot prompt
# examples, and offline mock transcripts — nor on test/eval/seed scripts, whose
# long lines are fixture data. Wrapping those would hurt, not help, readability.
"app/agent/templates/__init__.py" = ["E501"]  # 4-language message tables
"app/agent/llm.py" = ["E501"]                  # mock responses + multilingual keyword lists
"app/agent/nodes/intent.py" = ["E501"]         # few-shot classifier prompt
"app/agent/nodes/responder.py" = ["E501"]      # grounded-responder system prompt
"app/channels/voice/session.py" = ["E501"]     # multilingual IVR prompt strings
"app/channels/voice/stt.py" = ["E501"]         # offline mock transcripts
"app/channels/voice/tts.py" = ["E501"]         # offline mock/error strings
"evals/*" = ["E501"]                           # eval harness + fixture data
"tests/*" = ["E501"]                           # test fixtures
"ops/seed_tenant.py" = ["E501"]                # seed fixture data

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
