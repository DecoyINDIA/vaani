# Local dev + pilot deploy (ADR-06: single VPS, Docker Compose).
# MongoDB Atlas is external (ap-south-1) — not a service here.
# Prod deploy per 06-engineering-plan §1 (6.1): `git pull && docker compose up -d --build`.

services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build: .
    # Redis Streams consumers: inbound, reminders, weekly_summary (app/workers/).
    command: python -m app.workers.inbound
    env_file: .env
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
