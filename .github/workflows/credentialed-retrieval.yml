name: credentialed-retrieval

on:
  workflow_dispatch:

jobs:
  retrieval:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --frozen --extra dev
      - name: Run real Atlas/OpenRouter retrieval gate
        env:
          APP_ENV: dev
          USE_MOCK_ADAPTERS: "false"
          VAANI_RETRIEVAL_EVAL_MONGODB_URI: ${{ secrets.RETRIEVAL_EVAL_MONGODB_URI }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_MODEL_EMBEDDING: ${{ vars.LLM_MODEL_EMBEDDING }}
          KB_EMBEDDING_DIMENSIONS: ${{ vars.KB_EMBEDDING_DIMENSIONS || '1536' }}
          KB_TEXT_INDEX: ${{ vars.KB_TEXT_INDEX || 'kb_text' }}
          KB_VECTOR_INDEX: ${{ vars.KB_VECTOR_INDEX || 'kb_vector' }}
        run: >-
          uv run python evals/run_retrieval_eval.py --ci
          --report artifacts/retrieval-eval.json
      - name: Store sanitized retrieval evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: retrieval-evidence-${{ github.sha }}
          path: artifacts/retrieval-eval.json
          if-no-files-found: error
          retention-days: 30
