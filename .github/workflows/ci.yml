# CI pipeline per 06-engineering-plan §4:
#   ruff + mypy -> unit tests -> tenant-isolation suite -> eval gate -> real MongoDB
#   transaction/race suite -> image build.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install
        run: uv sync --frozen --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      # Rule 1 (06-engineering-plan §0): no raw DB access outside app/models/.
      - name: Tenant-isolation lint — no raw db access outside models/
        run: |
          if grep -rnE 'db\[[^]]+\]\.(find|insert|update|delete)' app --include='*.py' \
               | grep -v '^app/models/'; then
            echo "::error::Raw DB access found outside app/models/ — route through a tenant-scoped accessor."
            exit 1
          fi

      - name: Typecheck (mypy)
        run: uv run mypy app

      - name: Unit + integration tests
        run: uv run pytest -q

      # Eval gate: prompt/template/taxonomy changes must pass (intent F1 >= threshold,
      # hallucination incidents = 0). Wired at >=85% for the seed set (06-engineering-plan 3.6).
      - name: Eval gate
        run: uv run python evals/run_evals.py --ci --report artifacts/mock-eval-report.json

      - name: Store sanitized mock-eval evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mock-eval-evidence-${{ github.sha }}
          path: artifacts/mock-eval-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Build wheel from lock
        run: uv build --wheel

  dashboard:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build

  booking-transactions:
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install
        run: uv sync --frozen --extra dev

      - name: Start MongoDB replica set
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name vaani-mongo-rs -p 27017:27017 \
            mongo:7.0 --replSet rs0 --bind_ip_all
          for _ in {1..30}; do
            docker exec vaani-mongo-rs mongosh --quiet --eval \
              'quit(db.runCommand({ping: 1}).ok ? 0 : 1)' && break
            sleep 1
          done
          docker exec vaani-mongo-rs mongosh --quiet --eval \
            'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})'
          for _ in {1..30}; do
            docker exec vaani-mongo-rs mongosh --quiet --eval \
              'quit(db.hello().isWritablePrimary ? 0 : 1)' && break
            sleep 1
          done
          docker exec vaani-mongo-rs mongosh --quiet --eval \
            'quit(db.hello().isWritablePrimary ? 0 : 1)'

      - name: Run booking transaction and 500-claim race suite
        env:
          USE_MOCK_ADAPTERS: "false"
          VAANI_INTEGRATION_MONGODB_URI: mongodb://127.0.0.1:27017/vaani_integration?replicaSet=rs0&directConnection=true
        run: uv run pytest -q tests/integration/test_booking_transactions.py

  recovery-drill:
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install
        run: uv sync --frozen --extra dev

      - name: Dump, restore, and recover durable work
        shell: bash
        env:
          APP_ENV: dev
          USE_MOCK_ADAPTERS: "true"
          REDIS_URL: redis://127.0.0.1:6380/0
          RECOVERY_DRILL_CONFIRM: synthetic
        run: |
          set -euo pipefail
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          source="vaani-recovery-source-${suffix}"
          target="vaani-recovery-target-${suffix}"
          redis="vaani-recovery-redis-${suffix}"
          cleanup() {
            docker rm -f "$source" "$target" "$redis" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name "$source" -p 27017:27017 mongo:7.0
          docker run -d --name "$target" -p 27018:27017 mongo:7.0
          docker run -d --name "$redis" -p 6380:6379 redis:7-alpine
          for _ in {1..30}; do
            if docker exec "$source" mongosh --quiet --eval \
              'quit(db.runCommand({ping: 1}).ok ? 0 : 1)' \
              && docker exec "$target" mongosh --quiet --eval \
              'quit(db.runCommand({ping: 1}).ok ? 0 : 1)' \
              && docker exec "$redis" redis-cli ping | grep -q PONG; then
              break
            fi
            sleep 1
          done

          MONGODB_URI=mongodb://127.0.0.1:27017/vaani_recovery_drill \
            uv run python -m ops.recovery_drill seed
          started_at_epoch="$(date +%s)"
          docker exec "$source" mongodump --quiet --gzip \
            --db vaani_recovery_drill --archive=/tmp/recovery.archive
          docker cp "$source:/tmp/recovery.archive" "$RUNNER_TEMP/recovery.archive"
          backup_id="sha256:$(sha256sum "$RUNNER_TEMP/recovery.archive" | cut -d' ' -f1)"
          docker cp "$RUNNER_TEMP/recovery.archive" "$target:/tmp/recovery.archive"
          docker exec "$target" mongorestore --quiet --gzip \
            --archive=/tmp/recovery.archive
          MONGODB_URI=mongodb://127.0.0.1:27018/vaani_recovery_drill \
            uv run python -m ops.recovery_drill verify \
              --report artifacts/recovery-drill.json \
              --backup-id "$backup_id" \
              --started-at-epoch "$started_at_epoch"

      - name: Store synthetic recovery evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: synthetic-recovery-evidence-${{ github.sha }}
          path: artifacts/recovery-drill.json
          if-no-files-found: error
          retention-days: 30

  build:
    needs: [quality, dashboard, booking-transactions, recovery-drill]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t vaani:${{ github.sha }} .

      - name: Smoke API, dashboard, webhook, worker, and crash recovery from the built image
        shell: bash
        run: |
          set -euo pipefail
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          network="vaani-ci-${suffix}"
          mongo="vaani-mongo-${suffix}"
          redis="vaani-redis-${suffix}"
          api="vaani-api-${suffix}"
          worker="vaani-worker-${suffix}"
          holder="vaani-crash-holder-${suffix}"
          cleanup() {
            docker rm -f "$api" "$worker" "$holder" "$mongo" "$redis" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create "$network"
          docker run -d --name "$mongo" --network "$network" --network-alias mongo mongo:7.0
          docker run -d --name "$redis" --network "$network" --network-alias redis redis:7-alpine

          for _ in {1..30}; do
            if docker exec "$mongo" mongosh --quiet --eval 'quit(db.runCommand({ping: 1}).ok ? 0 : 1)' \
              && docker exec "$redis" redis-cli ping | grep -q PONG; then
              break
            fi
            sleep 1
          done
          docker exec "$mongo" mongosh --quiet --eval 'quit(db.runCommand({ping: 1}).ok ? 0 : 1)'
          docker exec "$redis" redis-cli ping | grep -q PONG

          common_env=(
            --env APP_ENV=dev
            --env MONGODB_URI=mongodb://mongo:27017/vaani
            --env REDIS_URL=redis://redis:6379/0
          )
          docker run -d --name "$api" --network "$network" -p 8000:8000 \
            "${common_env[@]}" "vaani:${GITHUB_SHA}"
          docker run -d --name "$worker" --network "$network" \
            "${common_env[@]}" "vaani:${GITHUB_SHA}" python -m app.workers.inbound

          for _ in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/health | grep -q '"status":"ok"' && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/health | grep -q '"status":"ok"'
          curl --fail --silent http://127.0.0.1:8000/ | grep -q '<div id="root"></div>'

          docker exec "$mongo" mongosh --quiet vaani --eval '
            db.tenants.insertOne({
              _id: "smoke-tenant",
              wa_number: "919999999999",
              timezone: "Asia/Kolkata"
            });
            db.contacts.insertOne({
              _id: "smoke-contact",
              tenant_id: "smoke-tenant",
              wa_id: "911111111111"
            });
            db.conversations.insertOne({
              _id: "smoke-conversation",
              tenant_id: "smoke-tenant",
              contact_id: "smoke-contact",
              channel: "wa",
              state: "human"
            });
            db.contacts.insertOne({
              _id: "crash-contact",
              tenant_id: "smoke-tenant",
              wa_id: "922222222222"
            });
            db.conversations.insertOne({
              _id: "crash-conversation",
              tenant_id: "smoke-tenant",
              contact_id: "crash-contact",
              channel: "wa",
              state: "human"
            });
            db.contacts.insertOne({
              _id: "ack-contact",
              tenant_id: "smoke-tenant",
              wa_id: "944444444444"
            });
            db.conversations.insertOne({
              _id: "ack-conversation",
              tenant_id: "smoke-tenant",
              contact_id: "ack-contact",
              channel: "wa",
              state: "human"
            });
            db.contacts.insertOne({
              _id: "receipt-contact",
              tenant_id: "smoke-tenant",
              wa_id: "955555555555"
            });
            db.conversations.insertOne({
              _id: "receipt-conversation",
              tenant_id: "smoke-tenant",
              contact_id: "receipt-contact",
              channel: "wa",
              state: "human"
            });
            db.contacts.insertOne({
              _id: "notify-contact",
              tenant_id: "smoke-tenant",
              wa_id: "966666666666"
            });
            db.conversations.insertOne({
              _id: "notify-conversation",
              tenant_id: "smoke-tenant",
              contact_id: "notify-contact",
              channel: "wa",
              state: "human"
            });
            db.contacts.insertOne({
              _id: "graph-contact",
              tenant_id: "smoke-tenant",
              wa_id: "977777777777"
            });
            db.conversations.insertOne({
              _id: "graph-conversation",
              tenant_id: "smoke-tenant",
              contact_id: "graph-contact",
              channel: "wa",
              state: "bot"
            });
          '
          webhook_payload='{"entry":[{"changes":[{"field":"messages","value":{"metadata":{"display_phone_number":"919999999999"},"messages":[{"id":"smoke-wamid","from":"911111111111","type":"text","text":{"body":"smoke handoff message"}}]}}]}]}'
          curl --fail --silent --request POST http://127.0.0.1:8000/webhooks/meta \
            --header 'Content-Type: application/json' --data "$webhook_payload" \
            | grep -q '"accepted": 1'
          curl --fail --silent --request POST http://127.0.0.1:8000/webhooks/meta \
            --header 'Content-Type: application/json' --data "$webhook_payload" \
            | grep -q '"status": "duplicate"'
          for _ in {1..30}; do
            if docker exec "$mongo" mongosh --quiet vaani --eval '
              const message = db.messages.findOne({_id: "smoke-wamid"});
              quit(message && message.direction === "inbound" &&
                message.text === "smoke handoff message" && !("status" in message) ? 0 : 1);
            '; then
              break
            fi
            sleep 1
          done
          docker exec "$mongo" mongosh --quiet vaani --eval '
            const message = db.messages.findOne({_id: "smoke-wamid"});
            const audit = db.audit_log.findOne({
              tenant_id: "smoke-tenant",
              event_type: "inbound_message"
            });
            const outbound = db.outbound_intents.countDocuments({tenant_id: "smoke-tenant"});
            quit(message && message.direction === "inbound" &&
              message.text === "smoke handoff message" && !("status" in message) &&
              audit && outbound === 0 ? 0 : 1);
          '

          for _ in {1..30}; do
            docker exec "$worker" python -m app.workers.healthcheck && break
            sleep 1
          done
          docker exec "$worker" python -m app.workers.healthcheck
          test "$(docker inspect --format '{{.State.Running}}' "$worker")" = true

          # Kill a process after it has leased and partially recorded durable work.
          # The replacement worker must recover from Mongo before Redis is available.
          docker rm -f "$worker"
          crash_script='import asyncio
          from app.models.collections import Messages

          payload = {"entry": [{"changes": [{"value": {
              "metadata": {"display_phone_number": "919999999999"},
              "messages": [{"id": "crash-wamid", "from": "922222222222",
                            "type": "text", "text": {"body": "crash recovery message"}}]
          }}]}]}

          async def hold():
              await Messages.accept_inbound_unscoped("crash-wamid", "smoke-tenant", payload)
              assert await Messages.acquire_work_unscoped("crash-wamid")
              await Messages.upsert_message_unscoped(
                  "crash-wamid", "smoke-tenant",
                  {"direction": "inbound", "type": "text", "text": "partial before kill"},
              )
              print("crash checkpoint ready", flush=True)
              await asyncio.Event().wait()

          asyncio.run(hold())'
          docker run -d --name "$holder" --network "$network" \
            "${common_env[@]}" "vaani:${GITHUB_SHA}" python -c "$crash_script"
          for _ in {1..30}; do
            if docker exec "$mongo" mongosh --quiet vaani --eval '
              const message = db.messages.findOne({_id: "crash-wamid"});
              quit(message && message.status === "processing" &&
                message.text === "partial before kill" && message.payload ? 0 : 1);
            '; then
              break
            fi
            sleep 1
          done
          docker exec "$mongo" mongosh --quiet vaani --eval '
            const message = db.messages.findOne({_id: "crash-wamid"});
            quit(message && message.status === "processing" &&
              message.text === "partial before kill" && message.payload ? 0 : 1);
          '
          docker kill "$holder"
          docker stop "$redis"
          docker exec "$mongo" mongosh --quiet vaani --eval '
            db.messages.updateOne(
              {_id: "crash-wamid"},
              {$set: {lease_expires_at: new Date(0)}}
            );
          '
          docker run -d --name "$worker" --network "$network" \
            "${common_env[@]}" "vaani:${GITHUB_SHA}" python -m app.workers.inbound
          for _ in {1..30}; do
            if docker exec "$mongo" mongosh --quiet vaani --eval '
              const message = db.messages.findOne({_id: "crash-wamid"});
              quit(message && message.text === "crash recovery message" &&
                message.attempts === 2 && !("status" in message) &&
                !("payload" in message) ? 0 : 1);
            '; then
              break
            fi
            sleep 1
          done
          docker exec "$mongo" mongosh --quiet vaani --eval '
            const message = db.messages.findOne({_id: "crash-wamid"});
            const audit = db.audit_log.findOne({
              tenant_id: "smoke-tenant",
              event_type: "inbound_message",
              "payload.wa_id": "922222222222"
            });
            quit(message && message.text === "crash recovery message" &&
              message.attempts === 2 && !("status" in message) &&
              !("payload" in message) && audit ? 0 : 1);
          '
          docker start "$redis"
          for _ in {1..30}; do
            docker exec "$worker" python -m app.workers.healthcheck && break
            sleep 1
          done
          docker exec "$worker" python -m app.workers.healthcheck

          # Kill after the handoff business commit but before event completion.
          # Recovery must not duplicate the escalation or lose the inbound event.
          docker rm -f "$worker" "$holder"
          commit_script='import asyncio
          import json
          from app import audit
          from app.models.collections import Messages
          from app.workers import inbound

          payload = {"entry": [{"changes": [{"value": {
              "metadata": {"display_phone_number": "919999999999"},
              "messages": [{"id": "commit-wamid", "from": "933333333333",
                            "type": "text", "text": {"body": "I need a human"}}]
          }}]}]}
          original_record = audit.record

          async def checkpoint(*args, **kwargs):
              await original_record(*args, **kwargs)
              if kwargs.get("event_type") == "escalation":
                  print("business commit checkpoint ready", flush=True)
                  await asyncio.Event().wait()

          async def hold():
              audit.record = checkpoint
              await Messages.accept_inbound_unscoped("commit-wamid", "smoke-tenant", payload)
              assert await Messages.acquire_work_unscoped("commit-wamid")
              await inbound.process_event({
                  "tenant_id": "smoke-tenant",
                  "message_id": "commit-wamid",
                  "payload": json.dumps(payload),
              })

          asyncio.run(hold())'
          docker run -d --name "$holder" --network "$network" \
            "${common_env[@]}" "vaani:${GITHUB_SHA}" python -c "$commit_script"
          for _ in {1..30}; do
            if docker exec "$mongo" mongosh --quiet vaani --eval '
              const message = db.messages.findOne({_id: "commit-wamid"});
              const contact = db.contacts.findOne({
                tenant_id: "smoke-tenant", wa_id: "933333333333"
              });
              const conversation = contact && db.conversations.findOne({
                tenant_id: "smoke-tenant", contact_id: contact._id.toString()
              });
              const escalations = db.escalations.countDocuments({
                tenant_id: "smoke-tenant", status: "open"
              });
              const audits = db.audit_log.countDocuments({
                tenant_id: "smoke-tenant", event_type: "escalation"
              });
              quit(message && message.status === "processing" && message.payload &&
                conversation && conversation.state === "human" &&
                escalations === 1 && audits === 1 ? 0 : 1);
            '; then
              break
            fi
            sleep 1
          done
          docker exec "$mongo" mongosh --quiet vaani --eval '
            const message = db.messages.findOne({_id: "commit-wamid"});
            const contact = db.contacts.findOne({
              tenant_id: "smoke-tenant", wa_id: "933333333333"
            });
            const conversation = contact && db.conversations.findOne({
              tenant_id: "smoke-tenant", contact_id: contact._id.toString()
            });
            quit(message && message.status === "processing" && message.payload &&
              conversation && conversation.state === "human" ? 0 : 1);
          '
          docker kill "$holder"
          docker stop "$redis"
          docker exec "$mongo" mongosh --quiet vaani --eval '
            db.messages.updateOne(
              {_id: "commit-wamid"},
              {$set: {lease_expires_at: new Date(0)}}
            );
          '
          docker run -d --name "$worker" --network "$network" \
            "${common_env[@]}" "vaani:${GITHUB_SHA}" python -m app.workers.inbound
          for _ in {1..30}; do
            if docker exec "$mongo" mongosh --quiet vaani --eval '
              const message = db.messages.findOne({_id: "commit-wamid"});
              quit(message && message.text === "I need a human" &&
                message.attempts === 2 && !("status" in message) &&
                !("payload" in message) ? 0 : 1);
            '; then
              break
            fi
            sleep 1
          done
          docker exec "$mongo" mongosh --quiet vaani --eval '
            const message = db.messages.findOne({_id: "commit-wamid"});
            const escalations = db.escalations.countDocuments({
              tenant_id: "smoke-tenant", status: "open"
            });
            const audits = db.audit_log.countDocuments({
              tenant_id: "smoke-tenant", event_type: "escalation"
            });
            quit(message && message.text === "I need a human" &&
              message.attempts === 2 && !("status" in message) &&
              !("payload" in message) && escalations === 1 && audits === 1 ? 0 : 1);
          '
          docker start "$redis"
          for _ in {1..30}; do
            docker exec "$worker" python -m app.workers.healthcheck && break
            sleep 1
          done
          docker exec "$worker" python -m app.workers.healthcheck

          # Kill after Mongo completion but before Redis acknowledgment. The
          # replacement worker must ACK the pending entry without reprocessing it.
          docker rm -f "$worker" "$holder"
          ack_script='import asyncio
          import json
          from app.gateway.middleware import get_redis
          from app.models.collections import Messages
          from app.workers import inbound

          payload = {"entry": [{"changes": [{"value": {
              "metadata": {"display_phone_number": "919999999999"},
              "messages": [{"id": "ack-wamid", "from": "944444444444",
                            "type": "text", "text": {"body": "pre ack recovery"}}]
          }}]}]}
          original_complete = Messages.mark_completed_unscoped

          async def checkpoint(message_id):
              await original_complete(message_id)
              print("pre-ack checkpoint ready", flush=True)
              await asyncio.Event().wait()

          async def hold():
              Messages.mark_completed_unscoped = checkpoint
              await Messages.accept_inbound_unscoped("ack-wamid", "smoke-tenant", payload)
              fields = {
                  "tenant_id": "smoke-tenant",
                  "message_id": "ack-wamid",
                  "payload": json.dumps(payload),
              }
              redis_client = get_redis()
              await inbound._ensure_group(redis_client)
              stream_id = await redis_client.xadd(inbound.STREAM, fields)
              response = await redis_client.xreadgroup(
                  inbound.GROUP,
                  inbound.CONSUMER,
                  {inbound.STREAM: ">"},
                  count=1,
              )
              claimed_id, claimed_fields = response[0][1][0]
              assert claimed_id == stream_id
              await inbound._handle(redis_client, claimed_id, claimed_fields, deliveries=1)

          asyncio.run(hold())'
          docker run -d --name "$holder" --network "$network" \
            "${common_env[@]}" "vaani:${GITHUB_SHA}" python -c "$ack_script"
          for _ in {1..30}; do
            if docker exec "$mongo" mongosh --quiet vaani --eval '
              const message = db.messages.findOne({_id: "ack-wamid"});
              quit(message && message.text === "pre ack recovery" &&
                message.attempts === 1 && !("status" in message) &&
                !("payload" in message) ? 0 : 1);
            ' && test "$(docker exec "$redis" redis-cli --raw \
              XPENDING vaani:inbound_stream vaani:workers | head -n1)" = "1"; then
              break
            fi
            sleep 1
          done
          docker exec "$mongo" mongosh --quiet vaani --eval '
            const message = db.messages.findOne({_id: "ack-wamid"});
            quit(message && message.text === "pre ack recovery" &&
              message.attempts === 1 && !("status" in message) &&
              !("payload" in message) ? 0 : 1);
          '
          test "$(docker exec "$redis" redis-cli --raw \
            XPENDING vaani:inbound_stream vaani:workers | head -n1)" = "1"
          docker kill "$holder"
          pending_id="$(docker exec "$redis" redis-cli --raw \
            XPENDING vaani:inbound_stream vaani:workers - + 1 | head -n1)"
          test -n "$pending_id"
          docker exec "$redis" redis-cli XCLAIM \
            vaani:inbound_stream vaani:workers worker-1 0 "$pending_id" \
            IDLE 60000 JUSTID | grep -q "$pending_id"
          docker run -d --name "$worker" --network "$network" \
            "${common_env[@]}" "vaani:${GITHUB_SHA}" python -m app.workers.inbound
          for _ in {1..30}; do
            if test "$(docker exec "$redis" redis-cli --raw \
              XPENDING vaani:inbound_stream vaani:workers | head -n1)" = "0"; then
              break
            fi
            sleep 1
          done
          test "$(docker exec "$redis" redis-cli --raw \
            XPENDING vaani:inbound_stream vaani:workers | head -n1)" = "0"
          docker exec "$mongo" mongosh --quiet vaani --eval '
            const message = db.messages.findOne({_id: "ack-wamid"});
            const audits = db.audit_log.countDocuments({
              tenant_id: "smoke-tenant",
              event_type: "inbound_message",
              "payload.wa_id": "944444444444"
            });
            quit(message && message.attempts === 1 && audits === 1 ? 0 : 1);
          '
          for _ in {1..30}; do
            docker exec "$worker" python -m app.workers.healthcheck && break
            sleep 1
          done
          docker exec "$worker" python -m app.workers.healthcheck

          # Kill the webhook process after durable receipt but before Redis wake-up.
          # Mongo must remain sufficient for a replacement worker to finish once.
          docker rm -f "$worker" "$holder"
          receipt_stream_length="$(docker exec "$redis" redis-cli XLEN vaani:inbound_stream)"
          receipt_script='import asyncio
          import json
          from starlette.requests import Request
          from app.gateway import meta
          from app.models.collections import Messages

          payload = {"entry": [{"changes": [{"value": {
              "metadata": {"display_phone_number": "919999999999"},
              "messages": [{"id": "receipt-wamid", "from": "955555555555",
                            "type": "text", "text": {"body": "receipt recovery"}}]
          }}]}]}
          original_accept = Messages.accept_inbound_unscoped

          async def checkpoint(message_id, tenant_id, event):
              await original_accept(message_id, tenant_id, event)
              print("receipt checkpoint ready", flush=True)
              await asyncio.Event().wait()

          async def hold():
              body = json.dumps(payload).encode()
              sent = False

              async def receive():
                  nonlocal sent
                  if sent:
                      return {"type": "http.disconnect"}
                  sent = True
                  return {"type": "http.request", "body": body, "more_body": False}

              Messages.accept_inbound_unscoped = checkpoint
              request = Request({"type": "http", "method": "POST", "path": "/webhooks/meta",
                                 "headers": [], "query_string": b""}, receive)
              await meta.receive(request)

          asyncio.run(hold())'
          docker run -d --name "$holder" --network "$network" \
            "${common_env[@]}" "vaani:${GITHUB_SHA}" python -c "$receipt_script"
          for _ in {1..30}; do
            if docker exec "$mongo" mongosh --quiet vaani --eval '
              const message = db.messages.findOne({_id: "receipt-wamid"});
              quit(message && message.status === "queued" && message.attempts === 0 &&
                message.payload ? 0 : 1);
            '; then
              break
            fi
            sleep 1
          done
          docker exec "$mongo" mongosh --quiet vaani --eval '
            const message = db.messages.findOne({_id: "receipt-wamid"});
            quit(message && message.status === "queued" && message.attempts === 0 &&
              message.payload ? 0 : 1);
          '
          test "$(docker exec "$redis" redis-cli XLEN vaani:inbound_stream)" = \
            "$receipt_stream_length"
          docker kill "$holder"
          docker stop "$redis"
          docker run -d --name "$worker" --network "$network" \
            "${common_env[@]}" "vaani:${GITHUB_SHA}" python -m app.workers.inbound
          for _ in {1..30}; do
            if docker exec "$mongo" mongosh --quiet vaani --eval '
              const message = db.messages.findOne({_id: "receipt-wamid"});
              quit(message && message.text === "receipt recovery" &&
                message.attempts === 1 && !("status" in message) &&
                !("payload" in message) ? 0 : 1);
            '; then
              break
            fi
            sleep 1
          done
          docker exec "$mongo" mongosh --quiet vaani --eval '
            const message = db.messages.findOne({_id: "receipt-wamid"});
            const audits = db.audit_log.countDocuments({
              tenant_id: "smoke-tenant", event_type: "inbound_message",
              "payload.wa_id": "955555555555"
            });
            quit(message && message.text === "receipt recovery" &&
              message.attempts === 1 && !("status" in message) &&
              !("payload" in message) && audits === 1 ? 0 : 1);
          '
          docker start "$redis"
          for _ in {1..30}; do
            docker exec "$worker" python -m app.workers.healthcheck && break
            sleep 1
          done
          docker exec "$worker" python -m app.workers.healthcheck

          # Kill the webhook process after the real Redis wake-up is committed.
          # The replacement worker must consume that stream entry exactly once.
          docker rm -f "$worker" "$holder"
          notification_stream_length="$(docker exec "$redis" redis-cli XLEN vaani:inbound_stream)"
          notification_script='import asyncio
          import json
          from starlette.requests import Request
          from app.gateway import meta

          payload = {"entry": [{"changes": [{"value": {
              "metadata": {"display_phone_number": "919999999999"},
              "messages": [{"id": "notify-wamid", "from": "966666666666",
                            "type": "text", "text": {"body": "notification recovery"}}]
          }}]}]}
          redis_client = meta.get_redis()

          class CheckpointRedis:
              async def xadd(self, *args, **kwargs):
                  result = await redis_client.xadd(*args, **kwargs)
                  print("notification checkpoint ready", flush=True)
                  await asyncio.Event().wait()
                  return result

          async def hold():
              body = json.dumps(payload).encode()
              sent = False

              async def receive():
                  nonlocal sent
                  if sent:
                      return {"type": "http.disconnect"}
                  sent = True
                  return {"type": "http.request", "body": body, "more_body": False}

              meta.get_redis = lambda: CheckpointRedis()
              request = Request({"type": "http", "method": "POST", "path": "/webhooks/meta",
                                 "headers": [], "query_string": b""}, receive)
              await meta.receive(request)

          asyncio.run(hold())'
          docker run -d --name "$holder" --network "$network" \
            "${common_env[@]}" "vaani:${GITHUB_SHA}" python -c "$notification_script"
          for _ in {1..30}; do
            current_stream_length="$(docker exec "$redis" redis-cli XLEN vaani:inbound_stream)"
            if docker exec "$mongo" mongosh --quiet vaani --eval '
              const message = db.messages.findOne({_id: "notify-wamid"});
              quit(message && message.status === "queued" && message.attempts === 0 &&
                message.payload ? 0 : 1);
            ' && test "$current_stream_length" = "$((notification_stream_length + 1))"; then
              break
            fi
            sleep 1
          done
          docker exec "$mongo" mongosh --quiet vaani --eval '
            const message = db.messages.findOne({_id: "notify-wamid"});
            quit(message && message.status === "queued" && message.attempts === 0 &&
              message.payload ? 0 : 1);
          '
          test "$(docker exec "$redis" redis-cli XLEN vaani:inbound_stream)" = \
            "$((notification_stream_length + 1))"
          docker kill "$holder"
          docker run -d --name "$worker" --network "$network" \
            "${common_env[@]}" "vaani:${GITHUB_SHA}" python -m app.workers.inbound
          for _ in {1..30}; do
            if docker exec "$mongo" mongosh --quiet vaani --eval '
              const message = db.messages.findOne({_id: "notify-wamid"});
              quit(message && message.text === "notification recovery" &&
                message.attempts === 1 && !("status" in message) &&
                !("payload" in message) ? 0 : 1);
            '; then
              break
            fi
            sleep 1
          done
          docker exec "$mongo" mongosh --quiet vaani --eval '
            const message = db.messages.findOne({_id: "notify-wamid"});
            const audits = db.audit_log.countDocuments({
              tenant_id: "smoke-tenant", event_type: "inbound_message",
              "payload.wa_id": "966666666666"
            });
            quit(message && message.text === "notification recovery" &&
              message.attempts === 1 && !("status" in message) &&
              !("payload" in message) && audits === 1 ? 0 : 1);
          '
          for _ in {1..30}; do
            docker exec "$worker" python -m app.workers.healthcheck && break
            sleep 1
          done
          docker exec "$worker" python -m app.workers.healthcheck

          # Kill during the first real LangGraph node. A concurrent staff takeover
          # then exercises recovery without replaying the pre-graph inbound audit.
          docker rm -f "$worker" "$holder"
          graph_script='import asyncio
          import json
          from app.agent import graph
          from app.models.collections import Messages
          from app.workers import inbound

          payload = {"entry": [{"changes": [{"value": {
              "metadata": {"display_phone_number": "919999999999"},
              "messages": [{"id": "graph-wamid", "from": "977777777777",
                            "type": "text", "text": {"body": "graph recovery"}}]
          }}]}]}
          original_lang_detect = graph.lang_detect

          async def checkpoint(state):
              result = await original_lang_detect(state)
              print("in-graph checkpoint ready", flush=True)
              await asyncio.Event().wait()
              return result

          async def hold():
              graph.lang_detect = checkpoint
              await Messages.accept_inbound_unscoped("graph-wamid", "smoke-tenant", payload)
              assert await Messages.acquire_work_unscoped("graph-wamid")
              await inbound.process_event({
                  "tenant_id": "smoke-tenant",
                  "message_id": "graph-wamid",
                  "payload": json.dumps(payload),
              })

          asyncio.run(hold())'
          docker run -d --name "$holder" --network "$network" \
            "${common_env[@]}" "vaani:${GITHUB_SHA}" python -c "$graph_script"
          for _ in {1..30}; do
            if docker exec "$mongo" mongosh --quiet vaani --eval '
              const message = db.messages.findOne({_id: "graph-wamid"});
              const audits = db.audit_log.countDocuments({
                tenant_id: "smoke-tenant", operation_key: "inbound:graph-wamid"
              });
              quit(message && message.status === "processing" && message.attempts === 1 &&
                message.payload && audits === 1 ? 0 : 1);
            '; then
              break
            fi
            sleep 1
          done
          docker exec "$mongo" mongosh --quiet vaani --eval '
            const message = db.messages.findOne({_id: "graph-wamid"});
            const audits = db.audit_log.countDocuments({
              tenant_id: "smoke-tenant", operation_key: "inbound:graph-wamid"
            });
            quit(message && message.status === "processing" && message.attempts === 1 &&
              message.payload && audits === 1 ? 0 : 1);
          '
          docker kill "$holder"
          docker stop "$redis"
          docker exec "$mongo" mongosh --quiet vaani --eval '
            db.messages.updateOne(
              {_id: "graph-wamid"},
              {$set: {lease_expires_at: new Date(0)}}
            );
            db.conversations.updateOne(
              {_id: "graph-conversation"},
              {$set: {state: "human"}}
            );
          '
          docker run -d --name "$worker" --network "$network" \
            "${common_env[@]}" "vaani:${GITHUB_SHA}" python -m app.workers.inbound
          for _ in {1..30}; do
            if docker exec "$mongo" mongosh --quiet vaani --eval '
              const message = db.messages.findOne({_id: "graph-wamid"});
              quit(message && message.text === "graph recovery" &&
                message.attempts === 2 && !("status" in message) &&
                !("payload" in message) ? 0 : 1);
            '; then
              break
            fi
            sleep 1
          done
          docker exec "$mongo" mongosh --quiet vaani --eval '
            const message = db.messages.findOne({_id: "graph-wamid"});
            const audits = db.audit_log.countDocuments({
              tenant_id: "smoke-tenant", operation_key: "inbound:graph-wamid"
            });
            quit(message && message.text === "graph recovery" &&
              message.attempts === 2 && !("status" in message) &&
              !("payload" in message) && audits === 1 ? 0 : 1);
          '
          docker start "$redis"
          for _ in {1..30}; do
            docker exec "$worker" python -m app.workers.healthcheck && break
            sleep 1
          done
          docker exec "$worker" python -m app.workers.healthcheck

          image_id="$(docker image inspect --format '{{.Id}}' "vaani:${GITHUB_SHA}")"
          echo "Built and smoke/crash-tested API/dashboard/webhook/worker image ID: \`${image_id}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Scan built image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vaani:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Publish verified candidate by digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          candidate="${repository}:candidate-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker tag "vaani:${GITHUB_SHA}" "$candidate"
          docker push "$candidate"
          digest_ref="$(docker image inspect --format '{{index .RepoDigests 0}}' "$candidate")"
          case "$digest_ref" in
            "${repository}"@sha256:*) ;;
            *) echo "::error::Registry digest was not recorded"; exit 1 ;;
          esac
          echo "Published verified candidate: \`${digest_ref}\`" >> "$GITHUB_STEP_SUMMARY"
