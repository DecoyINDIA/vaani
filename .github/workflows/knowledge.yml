name: knowledge

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-drift:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check knowledge links and source freshness
        run: python ops/knowledge.py check
