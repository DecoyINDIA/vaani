<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 96" width="560" height="96" role="img" aria-label="Vaani Logo - Your business, always answered.">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D6D56"/>
      <stop offset="60%" stop-color="#14493A"/>
      <stop offset="100%" stop-color="#0E2822"/>
    </linearGradient>

    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B37E28"/>
      <stop offset="100%" stop-color="#D97736"/>
    </linearGradient>

    <style>
      .brand-title {
        font-family: 'Plus Jakarta Sans', Aptos, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        letter-spacing: -0.035em;
        fill: #183F35;
      }
      .brand-tagline {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 500;
        fill: #485C54;
      }
      .brand-pill-text {
        font-family: 'Plus Jakarta Sans', 'Noto Sans Devanagari', 'Noto Sans Oriya', system-ui, sans-serif;
        font-weight: 600;
        fill: #1D6D56;
      }
      .brand-glyph-text {
        font-family: 'Noto Sans Devanagari', 'Anek Devanagari', sans-serif;
        font-weight: 800;
        fill: #FFFFFF;
        text-anchor: middle;
        dominant-baseline: central;
      }
      @media (prefers-color-scheme: dark) {
        .brand-title { fill: #FBF9F5; }
        .brand-tagline { fill: #CBD5E1; }
        .brand-pill-bg { fill: rgba(29, 109, 86, 0.25); stroke: rgba(29, 109, 86, 0.5); }
        .brand-pill-text { fill: #6EE7B7; }
      }
    </style>
  </defs>

  <!-- Brand Glyph Symbol -->
  <g transform="translate(10, 10)">
    <!-- Asymmetric squircle: 76x76 -->
    <path d="M 24 5 H 66 C 70.4 5 72 6.6 72 11 V 52 C 72 63.1 63.1 72 52 72 H 11 C 6.6 72 5 70.4 5 66 V 24 C 5 12.9 12.9 5 24 5 Z" 
          fill="url(#logoBgGrad)" 
          stroke="url(#logoGold)" 
          stroke-width="1.2"/>
    <!-- Voice resonance arc -->
    <path d="M 53 26 C 58 31 58 45 53 50" fill="none" stroke="#B37E28" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/>
    <text x="35" y="40" font-size="34" class="brand-glyph-text">वा</text>
    <circle cx="35" cy="14" r="2" fill="#B37E28"/>
  </g>

  <!-- Wordmark & Tagline -->
  <g transform="translate(100, 0)">
    <!-- Wordmark: "Vaani" -->
    <text x="0" y="46" font-size="38" class="brand-title">Vaani</text>
    <!-- Dot of the 'i' accent -->
    <circle cx="95" cy="24" r="3.5" fill="#D97736"/>

    <!-- Category / Promise Tagline -->
    <text x="0" y="70" font-size="14.5" class="brand-tagline">Your business, always answered.</text>

    <!-- Language & Trust Micro-badge -->
    <g transform="translate(230, 22)">
      <rect x="0" y="0" width="215" height="26" rx="13" fill="#EAF3EF" stroke="rgba(29, 109, 86, 0.2)" class="brand-pill-bg"/>
      <circle cx="12" cy="13" r="4" fill="#207E56"/>
      <text x="24" y="17" font-size="11.5" class="brand-pill-text">हिंदी · ଓଡ଼ିଆ · Hinglish · English</text>
    </g>
  </g>
</svg>
