<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" role="img" aria-label="Vaani Warm Intelligence Color Palette Matrix">
  <defs>
    <style>
      .hdr-title { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 22px; font-weight: 800; fill: #183F35; letter-spacing: -0.02em; }
      .hdr-sub { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: #788A82; }
      .sw-title { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 14px; font-weight: 700; }
      .sw-hex { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; font-weight: 600; }
      .sw-role { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 11px; font-weight: 500; }
      .sw-token { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10px; }
      .tag-pill { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    </style>
  </defs>

  <!-- Canvas Surface Background: Warm Paper Canvas -->
  <rect width="880" height="460" rx="16" fill="#FBF9F5" stroke="rgba(24, 63, 53, 0.12)" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(36, 36)">
    <!-- Brand Glyph Emblem -->
    <rect x="0" y="0" width="34" height="34" rx="10" fill="#1D6D56"/>
    <text x="17" y="24" font-family="'Noto Sans Devanagari', sans-serif" font-size="19" font-weight="800" fill="#FFF" text-anchor="middle">वा</text>
    
    <text x="46" y="22" class="hdr-title">Warm Intelligence · Color Architecture</text>
    <text x="46" y="38" class="hdr-sub">Authentic Indian craftsmanship meets enterprise-grade typography and WCAG AAA/AA accessibility standards.</text>
  </g>

  <!-- Swatch 1: Deep Spruce Ink (Primary Ink) -->
  <g transform="translate(36, 95)">
    <rect width="150" height="180" rx="12" fill="#183F35" stroke="rgba(0,0,0,0.1)"/>
    <!-- Swatch Info -->
    <rect y="110" width="150" height="70" rx="12" fill="#FFFFFF" stroke="rgba(24, 63, 53, 0.08)"/>
    <text x="14" y="132" class="sw-title" fill="#183F35">Deep Spruce</text>
    <text x="14" y="150" class="sw-hex" fill="#183F35">#183F35</text>
    <text x="14" y="166" class="sw-role" fill="#788A82">Ink Primary · Headings</text>
    <!-- Top badge -->
    <rect x="10" y="10" width="70" height="20" rx="10" fill="rgba(255,255,255,0.15)"/>
    <text x="45" y="24" class="tag-pill" fill="#FFF" text-anchor="middle">13.2:1 AAA</text>
  </g>

  <!-- Swatch 2: Emerald Jade (Brand Primary) -->
  <g transform="translate(202, 95)">
    <rect width="150" height="180" rx="12" fill="#1D6D56" stroke="rgba(0,0,0,0.1)"/>
    <rect y="110" width="150" height="70" rx="12" fill="#FFFFFF" stroke="rgba(24, 63, 53, 0.08)"/>
    <text x="14" y="132" class="sw-title" fill="#1D6D56">Emerald Jade</text>
    <text x="14" y="150" class="sw-hex" fill="#1D6D56">#1D6D56</text>
    <text x="14" y="166" class="sw-role" fill="#788A82">Brand CTAs · Glyph</text>
    <rect x="10" y="10" width="65" height="20" rx="10" fill="rgba(255,255,255,0.18)"/>
    <text x="42.5" y="24" class="tag-pill" fill="#FFF" text-anchor="middle">5.8:1 AA</text>
  </g>

  <!-- Swatch 3: Terracotta (Accent Urgency / Revenue) -->
  <g transform="translate(368, 95)">
    <rect width="150" height="180" rx="12" fill="#D97736" stroke="rgba(0,0,0,0.1)"/>
    <rect y="110" width="150" height="70" rx="12" fill="#FFFFFF" stroke="rgba(24, 63, 53, 0.08)"/>
    <text x="14" y="132" class="sw-title" fill="#D97736">Terracotta</text>
    <text x="14" y="150" class="sw-hex" fill="#D97736">#D97736</text>
    <text x="14" y="166" class="sw-role" fill="#788A82">Revenue · Urgency</text>
    <rect x="10" y="10" width="60" height="20" rx="10" fill="rgba(255,255,255,0.2)"/>
    <text x="40" y="24" class="tag-pill" fill="#FFF" text-anchor="middle">Accent</text>
  </g>

  <!-- Swatch 4: Temple Gold (Dignity / Trust) -->
  <g transform="translate(534, 95)">
    <rect width="150" height="180" rx="12" fill="#B37E28" stroke="rgba(0,0,0,0.1)"/>
    <rect y="110" width="150" height="70" rx="12" fill="#FFFFFF" stroke="rgba(24, 63, 53, 0.08)"/>
    <text x="14" y="132" class="sw-title" fill="#B37E28">Temple Gold</text>
    <text x="14" y="150" class="sw-hex" fill="#B37E28">#B37E28</text>
    <text x="14" y="166" class="sw-role" fill="#788A82">Trust · Briefs · Star</text>
    <rect x="10" y="10" width="60" height="20" rx="10" fill="rgba(255,255,255,0.2)"/>
    <text x="40" y="24" class="tag-pill" fill="#FFF" text-anchor="middle">Accent</text>
  </g>

  <!-- Swatch 5: Warm Paper Canvas -->
  <g transform="translate(700, 95)">
    <rect width="144" height="180" rx="12" fill="#F4EFE8" stroke="rgba(24, 63, 53, 0.15)"/>
    <rect y="110" width="144" height="70" rx="12" fill="#FFFFFF" stroke="rgba(24, 63, 53, 0.08)"/>
    <text x="14" y="132" class="sw-title" fill="#183F35">Warm Canvas</text>
    <text x="14" y="150" class="sw-hex" fill="#183F35">#FBF9F5</text>
    <text x="14" y="166" class="sw-role" fill="#788A82">Base Paper Ground</text>
    <rect x="10" y="10" width="60" height="20" rx="10" fill="rgba(24,63,53,0.08)"/>
    <text x="40" y="24" class="tag-pill" fill="#183F35" text-anchor="middle">Canvas</text>
  </g>

  <!-- Lower Section: Functional & Channel Swatches -->
  <g transform="translate(36, 295)">
    <rect width="808" height="135" rx="12" fill="#FFFFFF" stroke="rgba(24, 63, 53, 0.09)"/>

    <!-- Row 1: WhatsApp Bridge Tone -->
    <g transform="translate(20, 20)">
      <circle cx="16" cy="16" r="14" fill="#075E54"/>
      <text x="40" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" font-weight="700" fill="#183F35">WhatsApp Dark</text>
      <text x="40" y="28" font-family="'JetBrains Mono', monospace" font-size="11" fill="#788A82">#075E54 · Header &amp; Top Nav</text>

      <circle cx="210" cy="16" r="14" fill="#25D366"/>
      <text x="234" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" font-weight="700" fill="#183F35">WhatsApp Green</text>
      <text x="234" y="28" font-family="'JetBrains Mono', monospace" font-size="11" fill="#788A82">#25D366 · Online &amp; Send</text>

      <circle cx="410" cy="16" r="14" fill="#DCF8C6" stroke="#B2E29B"/>
      <text x="434" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" font-weight="700" fill="#183F35">Light Bubble</text>
      <text x="434" y="28" font-family="'JetBrains Mono', monospace" font-size="11" fill="#788A82">#DCF8C6 · User Outbound</text>

      <circle cx="610" cy="16" r="14" fill="#207E56"/>
      <text x="634" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" font-weight="700" fill="#183F35">Verified Success</text>
      <text x="634" y="28" font-family="'JetBrains Mono', monospace" font-size="11" fill="#788A82">#207E56 · Confirmed Booking</text>
    </g>

    <!-- Divider Line -->
    <line x1="20" y1="70" x2="788" y2="70" stroke="rgba(24, 63, 53, 0.08)"/>

    <!-- Row 2: Secondary Surfaces & Wash Tones -->
    <g transform="translate(20, 80)">
      <rect x="0" y="8" width="28" height="20" rx="4" fill="#EAF3EF" stroke="rgba(29,109,86,0.3)"/>
      <text x="38" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#1D6D56">Jade Subtle #EAF3EF</text>

      <rect x="200" y="8" width="28" height="20" rx="4" fill="#FDF3ED" stroke="rgba(217,119,54,0.3)"/>
      <text x="238" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#D97736">Terracotta Subtle #FDF3ED</text>

      <rect x="420" y="8" width="28" height="20" rx="4" fill="#FCF6EB" stroke="rgba(179,126,40,0.3)"/>
      <text x="458" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#B37E28">Gold Subtle #FCF6EB</text>

      <rect x="620" y="8" width="28" height="20" rx="4" fill="#FCF1F0" stroke="rgba(164,58,49,0.3)"/>
      <text x="658" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#A43A31">Danger Subtle #FCF1F0</text>
    </g>
  </g>
</svg>
