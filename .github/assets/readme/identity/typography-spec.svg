<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" role="img" aria-label="Vaani Typography & Vernacular System Specification">
  <defs>
    <style>
      .spec-hdr { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 22px; font-weight: 800; fill: #183F35; letter-spacing: -0.02em; }
      .spec-sub { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: #788A82; }
      .label-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; font-weight: 600; fill: #1D6D56; text-transform: uppercase; letter-spacing: 0.05em; }
      .sample-h1 { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 32px; font-weight: 800; fill: #183F35; letter-spacing: -0.03em; }
      .sample-h2 { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 20px; font-weight: 700; fill: #183F35; letter-spacing: -0.02em; }
      .sample-body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 14.5px; font-weight: 400; fill: #485C54; line-height: 1.5; }
      .sample-hindi { font-family: 'Noto Sans Devanagari', 'Anek Devanagari', system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: #183F35; }
      .sample-odia { font-family: 'Noto Sans Oriya', 'Anek Odia', system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: #183F35; }
      .sample-code { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12.5px; font-weight: 500; fill: #1D6D56; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="880" height="500" rx="16" fill="#FBF9F5" stroke="rgba(24, 63, 53, 0.12)" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(36, 36)">
    <rect x="0" y="0" width="34" height="34" rx="10" fill="#1D6D56"/>
    <text x="17" y="24" font-family="'Noto Sans Devanagari', sans-serif" font-size="19" font-weight="800" fill="#FFF" text-anchor="middle">वा</text>
    
    <text x="46" y="22" class="spec-hdr">Vernacular Typography Architecture</text>
    <text x="46" y="38" class="spec-sub">Multi-script harmony bridging Latin, Devanagari, and Odia typography with engineered monospace precision.</text>
  </g>

  <!-- Left Column: Latin Hierarchy -->
  <g transform="translate(36, 95)">
    <rect width="470" height="365" rx="12" fill="#FFFFFF" stroke="rgba(24, 63, 53, 0.08)"/>

    <g transform="translate(24, 24)">
      <!-- H1 Specimen -->
      <text x="0" y="0" class="label-mono">Display / H1 · 32px · Weight 800 · -0.03em</text>
      <text x="0" y="34" class="sample-h1">Your business, always answered.</text>

      <line x1="0" y1="52" x2="422" y2="52" stroke="rgba(24, 63, 53, 0.06)"/>

      <!-- H2 Specimen -->
      <text x="0" y="74" class="label-mono">Section Header / H2 · 20px · Weight 700 · -0.02em</text>
      <text x="0" y="104" class="sample-h2">Two Autonomous Agents, One Unified Desk</text>

      <line x1="0" y1="122" x2="422" y2="122" stroke="rgba(24, 63, 53, 0.06)"/>

      <!-- Body Specimen -->
      <text x="0" y="144" class="label-mono">Body Prose · 14.5px · Plus Jakarta Sans Regular</text>
      <text x="0" y="172" class="sample-body">Vaani answers incoming WhatsApp messages and telephone calls,</text>
      <text x="0" y="194" class="sample-body">books appointments with atomic hold guarantees, and delivers</text>
      <text x="0" y="216" class="sample-body">an 08:00 AM morning brief straight to the business owner.</text>

      <line x1="0" y1="236" x2="422" y2="236" stroke="rgba(24, 63, 53, 0.06)"/>

      <!-- Monospace Specimen -->
      <text x="0" y="258" class="label-mono">Code / Atomic Contracts · JetBrains Mono</text>
      <rect x="0" y="272" width="422" height="42" rx="6" fill="#F4EFE8"/>
      <text x="14" y="298" class="sample-code">HOLD_TTL_SECONDS = 120  # Atomic distributed lease</text>
    </g>
  </g>

  <!-- Right Column: Vernacular Indic Scripts -->
  <g transform="translate(522, 95)">
    <rect width="322" height="365" rx="12" fill="#FFFFFF" stroke="rgba(24, 63, 53, 0.08)"/>

    <g transform="translate(20, 24)">
      <!-- Hindi Script -->
      <rect x="0" y="0" width="82" height="22" rx="11" fill="#EAF3EF"/>
      <text x="41" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#1D6D56" text-anchor="middle">HINDI (हिंदी)</text>
      <text x="0" y="44" class="sample-hindi">नमस्ते! 🙏 मैं वाणी हूँ —</text>
      <text x="0" y="66" class="sample-hindi">Dr. Sharma Clinic की AI सहायक।</text>
      <text x="0" y="88" font-family="'Noto Sans Devanagari', sans-serif" font-size="13" fill="#788A82">कल शाम 5:30 बजे का slot खाली है।</text>

      <line x1="0" y1="106" x2="282" y2="106" stroke="rgba(24, 63, 53, 0.06)"/>

      <!-- Odia Script -->
      <rect x="0" y="122" width="82" height="22" rx="11" fill="#FCF6EB"/>
      <text x="41" y="137" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#B37E28" text-anchor="middle">ODIA (ଓଡ଼ିଆ)</text>
      <text x="0" y="166" class="sample-odia">ନମସ୍କାର! 🙏 ମୁଁ ବାଣୀ —</text>
      <text x="0" y="188" class="sample-odia">ଆପଣଙ୍କର ଡାକ୍ତର ସାକ୍ଷାତ ନିଶ୍ଚିତ ହେଲା।</text>
      <text x="0" y="210" font-family="'Noto Sans Oriya', sans-serif" font-size="13" fill="#788A82">କାଲି ସନ୍ଧ୍ୟା ୫:୩୦ ରେ ସମୟ ସ୍ଥିର ଅଛି।</text>

      <line x1="0" y1="228" x2="282" y2="228" stroke="rgba(24, 63, 53, 0.06)"/>

      <!-- Hinglish & English -->
      <rect x="0" y="244" width="130" height="22" rx="11" fill="#FDF3ED"/>
      <text x="65" y="259" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#D97736" text-anchor="middle">HINGLISH &amp; ENGLISH</text>
      <text x="0" y="286" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#183F35">"Kal shaam ko appointment chahiye"</text>
      <text x="0" y="306" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" fill="#788A82">"Slot confirmed for Saturday at 5:30 PM."</text>
    </g>
  </g>
</svg>
